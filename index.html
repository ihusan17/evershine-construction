async function setStatus(d, status, msg){ await put('docs', d.id, {...clone(d), status, updatedAt:new Date().toISOString()}); toast(msg); }
function docAction(d, act){
  if (!canEdit() || ((act === 'void' || act === 'unvoid') && !isOwnerRole())) return toast('Your role can\'t do that.');
  const T = TYPES[d.type];
  if (act === 'toInvoice') location.hash = `#/convert/${d.id}/invoice`;
  else if (act === 'toDN') location.hash = `#/convert/${d.id}/delivery`;
  else if (act === 'sent') setStatus(d, 'sent', 'Marked as sent');
  else if (act === 'accepted') setStatus(d, 'accepted', 'Marked as accepted');
  else if (act === 'rejected') setStatus(d, 'rejected', 'Marked as rejected');
  else if (act === 'reopen') setStatus(d, 'sent', 'Reopened');
  else if (act === 'void') voidBox(d);
  else if (act === 'unvoid'){
    const back = d.voided?.prev && d.voided.prev !== 'void' && d.voided.prev !== 'cancelled' ? d.voided.prev : (d.type === 'quotation' ? 'draft' : d.type === 'delivery' ? (d.delivered ? 'delivered' : 'pending') : 'issued');
    put('docs', d.id, {...clone(d), status:back, voided:null, updatedAt:new Date().toISOString()}).then(() => toast(`${d.number} restored`));
  }
  else if (act === 'undeliver') put('docs', d.id, {...clone(d), status:'pending', delivered:null, updatedAt:new Date().toISOString()}).then(() => toast('Marked as not delivered'));
  else if (act === 'pay') paymentBox(d);
  else if (act === 'deliver') deliverBox(d);
  else if (act === 'dup'){ const n = convertDraft(d, d.type); n.sourceId = null; history.pushState(null, '', '#/new/' + d.type); lastKey = 'new/' + d.type; renderSide(); viewEditor($('#main'), n, false); window.scrollTo(0,0); }
}
function voidBox(d){
  const T = TYPES[d.type];
  modal(`Void ${d.number}?`, `<p style="margin:0">The ${T.label.toLowerCase()} stays in your records and lists, marked <b>VOID</b>, and no longer counts in any totals${d.type === 'invoice' ? ' or amounts owed' : ''}. Its number is not reused. You can restore it later.</p>
    <div class="fld"><label for="v-r">Reason (optional)</label><input id="v-r" placeholder="e.g. Customer cancelled the order, issued by mistake"></div>`,
    'Void ' + T.label.toLowerCase(), async w => {
      const reason = w.querySelector('#v-r').value.trim();
      await put('docs', d.id, {...clone(d), status:'void', voided:{date:todayISO(), reason, prev:d.status || ''}, updatedAt:new Date().toISOString()});
      toast(`${d.number} voided`);
    }, true);
}

/* ---------- dialogs ---------- */
function modal(title, body, okText, onOk, danger){
  const w = document.createElement('div'); w.className = 'scrim';
  w.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3><div class="mb">${body}</div><div class="mf"><button class="btn ghost" data-x>Close</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${esc(okText)}</button></div></div>`;
  document.body.appendChild(w);
  const close = () => { w.remove(); document.removeEventListener('keydown', key); onData(); };
  const key = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', key);
  w.addEventListener('click', e => { if (e.target === w || e.target.closest('[data-x]')) close(); });
  w.querySelector('[data-ok]').addEventListener('click', async e => {
    e.currentTarget.disabled = true;
    try { const r = await onOk(w); if (r === false){ e.currentTarget.disabled = false; return; } close(); } catch(err){ e.currentTarget.disabled = false; }
  });
  const f = w.querySelector('input,textarea,select'); (f || w.querySelector('[data-ok]')).focus();
  return w;
}
function confirmBox(title, text, okText, fn){ modal(title, `<p style="margin:0">${esc(text)}</p>`, okText, fn, true); }
function paymentBox(d){
  modal(`Record payment for ${d.number}`, `
    <div class="fld"><label for="p-amt">Amount (MVR)</label><input id="p-amt" inputmode="decimal" value="${balance(d).toFixed(2)}"><span class="hint">Balance is MVR ${money(balance(d))}</span></div>
    <div class="fld"><label for="p-date">Date received</label><input id="p-date" type="date" value="${todayISO()}"></div>
    <div class="fld"><label for="p-m">Method</label><select id="p-m"><option>Bank transfer</option><option>Cash</option><option>Cheque</option><option>Other</option></select></div>
    <div class="fld"><label for="p-ref">Reference</label><input id="p-ref" placeholder="Optional, e.g. transfer reference"></div>`,
    'Record payment', async w => {

const FOOT_BLUE = '#2f7fc1';
const footIcon = inner => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="${FOOT_BLUE}"/><g transform="translate(7 7) scale(.75)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</g></svg>`;
const FOOT_SVG = {

  phone: footIcon('<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>')
};
let FOOT_PNG = null;   // same icons as PNG for the PDF
async function footIcons(){
  if (FOOT_PNG) return FOOT_PNG;
  const toPng = svg => new Promise(res => {
    const img = new Image();
    img.onload = () => { const c = document.createElement('canvas'); c.width = c.height = 128; c.getContext('2d').drawImage(img, 0, 0, 128, 128); try { res(c.toDataURL('image/png')); } catch(e){ res(null); } };
    img.onerror = () => res(null);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
  FOOT_PNG = {mail: await toPng(FOOT_SVG.mail), phone: await toPng(FOOT_SVG.phone)};
  return FOOT_PNG;
}
// names and dates printed in the delivery note signature boxes (older notes only have `delivered`)
const dnSigns = d => { const g = d.signs || {}, dl = d.delivered || {};
  return {byName: g.byName ?? '', byDate: g.byDate ?? (dl.date || ''), toName: g.toName ?? (dl.name || ''), toDate: g.toDate ?? (dl.date || '')}; };
const signImg = () => S.settings.signImage || SIGN;
const signScale = (st = S.settings) => Math.min(1.5, Math.max(0.5, num(st.signScale) || 1));
let SIGN_INFO = null;   // {key, src, w, h} of the current signature for the PDF, with any white paper made transparent
async function loadSignInfo(){
  const key = signImg();
  if (SIGN_INFO && SIGN_INFO.key === key) return SIGN_INFO;
  const src = await cleanSignature(key, true, 235) || key;   // only near-white is removed, so the ink is untouched
  return new Promise(res => { const im = new Image(); im.onload = () => res(SIGN_INFO = {key, src, w:im.naturalWidth, h:im.naturalHeight}); im.onerror = () => res(SIGN_INFO = null); im.src = src; });
}
function sheetHTML(d){
  const s = S.settings, T = TYPES[d.type], c = d.customer || {}, isDN = d.type === 'delivery', lump = d.layout === 'lump' && !isDN;
  const st = statusOf(d);
  const items = d.items || [];
  const td = (v, cls='') => `<td class="${cls} ${hasThaana(v) ? 'dv' : ''}">${nl(v)}</td>`;
  let head, rows, cols;
  if (isDN){ cols = 4; head = `<th style="width:50px" class="c">S/N</th><th>Description</th><th style="width:90px" class="c">Unit</th><th style="width:100px" class="r">Qty</th>`;
    rows = items.map((it,i) => `<tr><td class="c">${i+1}</td>${td(it.desc)}<td class="c">${esc(it.unit)}</td><td class="r">${qfmt(it.qty)}</td></tr>`); }
  else if (lump){ cols = 2; head = `<th>Description</th><th style="width:150px" class="r">Amount (MVR)</th>`;
    rows = items.map(it => `<tr>${kindOf(d) === 'hire' ? `<td>${hireCell(it)}</td>` : td(it.desc)}<td class="r">${money(lineAmt(d,it))}</td></tr>`); }
  else { cols = 5; head = `<th>Description</th><th style="width:70px" class="c">Unit</th><th style="width:80px" class="r">Qty</th><th style="width:90px" class="r">Rate</th><th style="width:120px" class="r">Amt. (MVR)</th>`;
    rows = items.map(it => `<tr>${td(it.desc)}<td class="c">${esc(it.unit)}</td><td class="r">${qfmt(it.qty)}</td><td class="r">${money(it.rate)}</td><td class="r">${money(lineAmt(d,it))}</td></tr>`); }
  const meta = [[T.numLabel, d.number], [T.dateLabel + ':', fmtDate(d.date)]];
  if (d.type === 'quotation') meta.push(['Valid until:', fmtDate(addDays(d.date, d.validDays))]);
  if (d.type === 'invoice') meta.push(['Due date:', fmtDate(addDays(d.date, d.dueDays))]);
  meta.push(['P.O Number:', d.po || '-']);
  const terms = (d.terms || '').split('\n').map(x => x.trim()).filter(Boolean);
  const paidNow = paidOf(d), sg = dnSigns(d);
  let sum = '';

  else sum = `<div class="sum"><div class="w"><b>Amount in words (MVR):</b> ${esc(amountWords(total(d)))}</div><table>
      <tr><td>Sub Total</td><td>${money(subtotal(d))}</td></tr>
      ${discAmt(d) ? `<tr><td>${esc(discLabel(d))}</td><td>-${money(discAmt(d))}</td></tr>` : ''}
      ${num(d.taxRate) ? `<tr><td>GST ${num(d.taxRate)}%</td><td>${money(taxAmt(d))}</td></tr>` : ''}
      <tr class="gt"><td>Grand Total</td><td>${money(total(d))}</td></tr>
      ${d.type === 'invoice' && paidNow > 0 && st !== 'paid' ? `<tr><td>Paid</td><td>${money(paidNow)}</td></tr><tr class="bal"><td>Balance due</td><td>${money(balance(d))}</td></tr>` : ''}
    </table></div>`;
  return `<div class="sheet">
    ${st === 'void' ? '<div class="void">VOID</div>' : ''}
    <div class="hd">
      <div class="co"><img src="${LOGO}" alt=""><div><b>${esc(s.name)}</b><div>${nl(s.address)}</div><div>Phone: ${esc(s.phone)}</div><div>Email: ${esc(s.email)}</div></div></div>
      <div class="ttl"><h1>${esc(T.title)}</h1><table class="meta">${meta.map(([k,v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table></div>
    </div>
    <div class="parties">
      <div><div class="lab">CUSTOMER</div><div class="nm">${esc(c.name)}</div><div>${nl(c.address)}</div>${c.phone ? `<div>${esc(c.phone)}</div>` : ''}</div>
      ${isDN && d.deliveryAddress ? `<div style="text-align:right"><div class="lab">DELIVERY ADDRESS</div><div>${nl(d.deliveryAddress)}</div></div>` : ''}
    </div>
    ${d.project ? `<div class="project">PROJECT: ${esc(d.project)}</div>` : ''}
    <div class="itbox"><table class="it"><thead><tr>${head}</tr></thead><tbody>${rows.join('')}</tbody></table><div class="itfill"></div></div>
    ${sum.replace('<div class="sum">', `<div class="sum">${showPaidStamp(d) ? `<img class="stamp" src="${stampURL(d)}" alt="Paid">` : ''}`)}
    ${isDN ? `<div class="msg">${d.message ? `<p>${nl(d.message)}</p>` : ''}${s.deliveryNote ? `<p>${nl(s.deliveryNote)}</p>` : ''}</div>
      <div class="signs">
        ${[['Delivered by:', sg.byName, sg.byDate, s.signDelivery && signImg()], ['Received by:', sg.toName, sg.toDate, '']].map(([t, nm, dt, img]) =>
          `<div><b>${t}</b><div class="ln sg"><span>Sign:</span><span>${img ? `<img src="${img}" alt="" style="--sc:${signScale()}">` : ''}</span></div><div class="ln"><span>Name:</span><span>${esc(nm)}</span></div><div class="ln"><span>Date:</span><span>${dt ? fmtDate(dt) : ''}</span></div></div>`).join('')}
      </div>`
    : `${terms.length ? `<div class="terms"><b>Terms &amp; Conditions</b>${terms.map(t => `<p>${esc(t)}</p>`).join('')}</div>` : ''}
       <div class="botrow"><div class="bank"><b>Bank Details</b><span>Bank Name</span><div>${esc(s.bankName)}</div><span>Acc no.</span><div>${esc(s.accNo)}</div><span>Acc Name</span><div>${esc(s.accName)}</div></div>
       <div class="auth"><div class="for">For ${esc(s.name)}</div><div class="sl">${s.signDocs !== false && signImg() ? `<img src="${signImg()}" alt="" style="max-height:${Math.round(56 * signScale())}px">` : ''}</div><div class="cap">Authorised signature</div>${s.signName ? `<div class="nm">${esc(s.signName)}</div>` : ''}</div></div>`}
    <div class="foot">${s.thanks ? `<b>${esc(s.thanks)}</b>` : ''}<div class="bar"><i></i><i></i></div>
      <div class="q">If you have any queries regarding this ${T.label.toLowerCase()}, please contact</div>
      <div class="ct">${s.email ? `<span>${FOOT_SVG.mail}${esc(s.email)}</span>` : ''}${s.phone ? `<span>${FOOT_SVG.phone}${esc(s.phone)}</span>` : ''}</div></div>
  </div>`;
}
function fitSheets(){
  document.querySelectorAll('.sheet-fit').forEach(w => {
    const sh = w.firstElementChild; if (!sh) return;
    const k = Math.min(1, w.clientWidth / 794);
    sh.style.transformOrigin = 'top left'; sh.style.transform = k < 1 ? `scale(${k})` : '';
    w.style.height = (sh.offsetHeight * k) + 'px';
  });
}

/* ---------- files ---------- */
async function saveFile(filename, data){
  if (downloads){
    try { await downloads.save({filename, data}); return true; }
    catch(e){ if (e && e.code === 'declined') return false; if (e && e.code === 'rate_limited'){ toast('A save is already waiting for your confirmation.'); return false; } }
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data]);
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    return true;
  } catch(e){ toast('Downloads aren\'t available in this view.'); return false; }
}
function loadScript(src){
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`) && window.jspdf) return res();
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
}

const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
// Dhivehi (Thaana) is right-to-left. jsPDF's built-in bidi already lays right-to-left text out, letters and fili included,
// exactly like the browser, so text goes to the PDF unchanged. (Reversing it here as well turned Dhivehi the wrong way round.)
const APP_VERSION = '2026-10-07 · Dhivehi v4';   // shown at the bottom of Settings, to check the browser has the newest portal
const vis = s => String(s ?? '');

// Page geometry, colours and text helpers shared by every PDF (documents and statements)
function pdfKit(pdf){
  const k = {BLUE:[51,102,155], INK:[27,27,27], GREY:[85,85,85], LINE:[221,227,234], ZEBRA:[245,248,251], WHITE:[255,255,255], W:210, H:297, L:14.3};
  k.R = k.W - 14.3; k.CW = k.R - k.L; k.BOTTOM = k.H - 22;
  k.font = (sz, bold, col = k.INK) => { pdf.setFont('FS', bold ? 'bold' : 'normal'); pdf.setFontSize(sz); pdf.setTextColor(...col); };
  k.lh = sz => sz * 0.3528 * 1.38;
  k.txt = (t, x, y, o) => pdf.text(vis(t), x, y, o);
  k.wrap = (t, w) => String(t ?? '').split('\n').flatMap(p => p.trim() === '' ? [''] : pdf.splitTextToSize(vis(p), w));
  k.tw = t => pdf.getTextWidth(vis(t));
  return k;
}
// Logo + company on the left, title + meta lines on the right. Returns the y below it.
function pdfHeader(pdf, k, title, meta){
  const s = S.settings, {L, R, BLUE, GREY, font, lh, txt, tw} = k;
  pdf.addImage(LOGO, 'JPEG', L, 11, 27.5, 21.1, 'logo', 'NONE');
  let cy = 15.2, cx = L + 31;
  font(11, true); txt(s.name, cx, cy); cy += lh(11);
  font(9.4, false, [51,51,51]);
  [...String(s.address||'').split('\n'), 'Phone: ' + (s.phone||''), 'Email: ' + (s.email||'')].forEach(t => { txt(t, cx, cy); cy += lh(9.4); });
  font(22.5, true, BLUE); txt(title, R, 18.5, {align:'right'});
  font(9.75, true); const vw = Math.max(...meta.map(m => tw(m[1])));
  let my = 26.5;
  meta.forEach(([a,v]) => { font(9.75, false, GREY); txt(a, R - vw - 3.2, my, {align:'right'}); font(9.75, true); txt(v, R, my, {align:'right'}); my += lh(9.75); });
  return Math.max(cy, my, 33) + 7;
}
// Bank Details block with the blue bar. Returns {top, y}.
function pdfBank(pdf, k, y){
  const s = S.settings, {L, BLUE, GREY, font, lh, txt, tw} = k;
  const top = y - 3.6, BX = L + 4.2;
  font(9.75, true, BLUE); pdf.text('Bank Details', BX, y); y += lh(9.75) + 0.6;
  const rows = [['Bank Name', s.bankName], ['Acc no.', s.accNo], ['Acc Name', s.accName]];
  font(9.4, false); const lab = Math.max(...rows.map(r => tw(r[0]))) + 4.5;
  rows.forEach(([a, v]) => { font(9.4, false, GREY); txt(a, BX, y); font(9.4, false); txt(v || '', BX + lab, y); y += lh(9.4); });
  pdf.setFillColor(...BLUE); pdf.rect(L, top, 1.05, y - top - 2.4, 'F');
  return {top, y};
}
// "For <company> / signature / Authorised signature / name" on the right. Returns the y below it.
function pdfAuthSign(pdf, k, top){
  const s = S.settings, {R, GREY, font, lh, txt} = k, BW = 62, x = R - BW, cx = x + BW / 2;
  font(9, true); txt('For ' + (s.name || ''), cx, top + 3, {align:'center'});
  const ly = top + 24;
  const sign = s.signDocs !== false && SIGN_INFO;
  if (sign){
    const mw = BW * 0.9, mh = 15.5 * signScale(); let w = mw, h = w * sign.h / sign.w; if (h > mh){ h = mh; w = h * sign.w / sign.h; }
    pdf.addImage(sign.src, /^data:image\/jpe?g/i.test(sign.src) ? 'JPEG' : 'PNG', cx - w/2, ly + 1.6 - h, w, h, 'sign', 'NONE');
  }
  pdf.setDrawColor(154,163,173); pdf.setLineWidth(0.25); pdf.line(x, ly, R, ly);
  font(9, false, GREY); txt('Authorised signature', cx, ly + 4.4, {align:'center'});
  let yy = ly + 4.4;
  if (s.signName){ yy += lh(9); font(9.2, true); txt(s.signName, cx, yy, {align:'center'}); }
  return yy + 2;
}
// Thank-you line, two-colour bar and contact line on the last page; page numbers when there are several.
function pdfFooter(pdf, k, y, label, ref){
  const s = S.settings, {W, H, L, R, CW, BLUE, GREY, font, txt, tw} = k;
  const fTop = s.thanks ? H - 34 : H - 28;
  if (y > fTop - 3){ pdf.addPage(); }
  if (s.thanks){ font(10, true, BLUE); txt(s.thanks, W/2, H - 29.5, {align:'center'}); }
  pdf.setFillColor(51,51,51); pdf.rect(L, H - 26, CW/2, 1.1, 'F');
  pdf.setFillColor(47,127,193); pdf.rect(L + CW/2, H - 26, CW/2, 1.1, 'F');
  pdf.setFont('helvetica', 'normal'); pdf.setFontSize(11); pdf.setTextColor(51,51,51);
  pdf.text(`If you have any queries regarding this ${label}, please contact`, W/2, H - 19.5, {align:'center'});
  const IC = 7.4, GAP = 2.6, SEP = 12, cyc = H - 11.6;
  const parts = [['mail', s.email], ['phone', s.phone]].filter(p => p[1]);
  font(10.5, true, [51,51,51]);
  const widths = parts.map(p => IC + GAP + tw(p[1]));
  let fx = W/2 - (widths.reduce((a,b) => a + b, 0) + SEP * (parts.length - 1)) / 2;
  parts.forEach(([key, v], i) => {
    const png = FOOT_PNG && FOOT_PNG[key];
    if (png) pdf.addImage(png, 'PNG', fx, cyc - IC/2, IC, IC, 'foot-' + key, 'NONE');
    else { pdf.setFillColor(47,127,193); pdf.circle(fx + IC/2, cyc, IC/2, 'F'); }
    font(10.5, true, [51,51,51]); txt(v, fx + IC + GAP, cyc + 1.3);
    fx += widths[i] + SEP;
  });
  const n = pdf.getNumberOfPages();
  if (n > 1) for (let p = 1; p <= n; p++){ pdf.setPage(p); font(8.5, false, GREY); pdf.text(`${ref} · Page ${p} of ${n}`, R, H - 6, {align:'right'}); }
  return fTop;
}
// fill: extra mm added below the item lines so the page reaches the footer (worked out by buildPDF).
// Returns where the content ended, for that measurement.
function drawPDF(pdf, d, fill){
  const s = S.settings, T = TYPES[d.type], c = d.customer || {}, isDN = d.type === 'delivery', lump = d.layout === 'lump' && !isDN, st = statusOf(d);
  const k = pdfKit(pdf), {BLUE, INK, GREY, LINE, ZEBRA, WHITE, W, H, L, R, CW, BOTTOM, font, lh, txt, wrap, tw} = k;
  let y;

  if (st === 'void'){
    font(150, true, [248,224,221]); pdf.text('VOID', 52, 225, {angle:28});
  }

  // header: logo + company, title + meta
  const meta = [[T.numLabel, d.number], [T.dateLabel + ':', fmtDate(d.date)]];
  if (d.type === 'quotation') meta.push(['Valid until:', fmtDate(addDays(d.date, d.validDays))]);
  if (d.type === 'invoice') meta.push(['Due date:', fmtDate(addDays(d.date, d.dueDays))]);
  meta.push(['P.O Number:', d.po || '-']);
  y = pdfHeader(pdf, k, T.title, meta);

  // customer / delivery address
  const top = y;
  font(8.6, true, BLUE); pdf.text('CUSTOMER', L, y); y += lh(9.5);
  font(10.8, true); wrap(c.name, 100).forEach(t => { txt(t, L, y); y += lh(10.8); });
  font(9.75, false);
  (String(c.address||'').trim() ? wrap(c.address, 100) : []).concat(c.phone ? [c.phone] : []).forEach(t => { txt(t, L, y); y += lh(9.75); });
  if (isDN && d.deliveryAddress){
    let ry = top; font(8.6, true, BLUE); pdf.text('DELIVERY ADDRESS', R, ry, {align:'right'}); ry += lh(9.5);
    font(9.75, false); wrap(d.deliveryAddress, 70).forEach(t => { txt(t, R, ry, {align:'right'}); ry += lh(9.75); });
    y = Math.max(y, ry);
  }
  if (d.project){ y += 6.5; font(10, true); wrap('PROJECT: ' + d.project, CW).forEach(t => { txt(t, L, y); y += lh(10); }); }
  y += 2.5;

  // items table
  let cols;
  if (isDN) cols = [{h:'S/N', w:13, a:'center'}, {h:'Description', w:0, a:'left'}, {h:'Unit', w:24, a:'center'}, {h:'Qty', w:26, a:'right'}];
  else if (lump) cols = [{h:'Description', w:0, a:'left'}, {h:'Amount (MVR)', w:40, a:'right'}];
  else cols = [{h:'Description', w:0, a:'left'}, {h:'Unit', w:18.5, a:'center'}, {h:'Qty', w:21, a:'right'}, {h:'Rate', w:24, a:'right'}, {h:'Amt. (MVR)', w:32, a:'right'}];
  const fixed = cols.reduce((a,k) => a + k.w, 0); cols.forEach(k => { if (!k.w) k.w = CW - fixed; });
  let x0 = L; cols.forEach(k => { k.x = x0; x0 += k.w; });
  const PAD = 2.6;
  const cellX = k => k.a === 'right' ? k.x + k.w - PAD : k.a === 'center' ? k.x + k.w/2 : k.x + PAD;
  const headRow = () => {
    pdf.setFillColor(...BLUE); pdf.rect(L, y, CW, 7.6, 'F');
    font(9.4, true, WHITE); cols.forEach(k => pdf.text(k.h, cellX(k), y + 5.1, {align:k.a}));
    y += 7.6;
  };
  headRow();
  const items = d.items || [];
  items.forEach((it, i) => {
    const vals = isDN ? [String(i+1), it.desc, it.unit || '', qfmt(it.qty)]
      : lump ? [kindOf(d) === 'hire' ? hireLines(it) : it.desc, money(lineAmt(d,it))]
      : [it.desc, it.unit || '', qfmt(it.qty), money(it.rate), money(lineAmt(d,it))];
    font(9.75, false);
    const dIdx = isDN ? 1 : 0;
    const hire = lump && kindOf(d) === 'hire', pts = hire ? routePts(it) : [], hasRoute = hire && (pts.length || it.when);
    if (hire) font(9.75, true);
    const lines = wrap(hire ? it.desc : vals[dIdx], cols[dIdx].w - PAD*2);
    // lay the route map out first: each island is a station (label, dot, name); rows wrap when there are many stops
    let rLines = [];
    const SP = 2.8, RH = 12, NW = 28, NLH = lh(9.4);   // long place names wrap at NW mm under their dot
    if (hasRoute){
      const k0 = cols[dIdx], x0 = cellX(k0) - SP, right = k0.x + k0.w - PAD;
      font(9.4, true); const dw = it.when ? Math.max(tw(it.when), 8) : 0;
      let cur = [], rx = x0, limit = it.when ? right - dw - 7 : right; const lim0 = limit;
      pts.forEach((p, i) => {
        font(9.4, true); const nl = tw(p[1]) > NW ? wrap(p[1], NW) : [vis(p[1])], nw = Math.max(...nl.map(t => pdf.getTextWidth(t)));
        font(6.8, true); const lw = tw(p[0]);
        const w = Math.max(nw, lw, 15.5) + SP * 2;
        if (cur.length && rx + w > limit){ rLines.push(cur); cur = []; rx = x0; limit = right; }
        cur.push({lab:p[0], nl, g:i, x:rx, w, c:w / 2}); rx += w;   // c: where the dot sits inside the station
      });
      if (cur.length || it.when) rLines.push(cur);
      // a short route (one row, 2+ places) is stretched so it reaches at least the middle of the page
      const r0 = rLines[0];
      if (rLines.length === 1 && r0.length > 1){
        // lengthen the line after each place (the names stay put) so the last dot sits at the middle of the page, never into the DATE column
        const n = r0.length, lw = r0[n - 1].w, end = r0[n - 1].x + lw;
        const add = Math.min((W / 2 - (end - lw / 2)) / (n - 1), (lim0 - end) / (n - 1));
        if (add > 0){ let x = x0; r0.forEach((p, i) => { if (i < n - 1) p.w += add; p.x = x; x += p.w; }); }
      }
      rLines.forEach(row => { row.h = RH + (Math.max(1, ...row.map(p => p.nl.length)) - 1) * NLH; });
      rLines.dw = dw;
    }
    const rh = Math.max(1, lines.length) * lh(9.75) + 3.8 + rLines.reduce((a, row) => a + row.h, 0) + (rLines.length ? 1.2 : 0);
    if (y + rh > BOTTOM){ pdf.addPage(); y = 16; headRow(); }
    if (i % 2){ pdf.setFillColor(...ZEBRA); pdf.rect(L, y, CW, rh, 'F'); }
    font(9.75, hire);
    cols.forEach((k, ci) => {
      if (ci === dIdx) lines.forEach((t, li) => pdf.text(t, cellX(k), y + 5.2 + li * lh(9.75)));
      else { font(9.75, false); pdf.text(vis(vals[ci]), cellX(k), y + 5.2, {align:k.a}); }
    });
    if (hasRoute){
      // route map: blue line through the islands (orange dashes for the return leg), filled dots at FROM / TO, open dots at stops
      const k0 = cols[dIdx], ORANGE = [208,120,47], last = pts.length - 1;
      const seg = (x1, x2, yy, ret) => { if (x2 - x1 < 0.2) return; pdf.setLineWidth(0.5);
        if (ret){ pdf.setDrawColor(...ORANGE); pdf.setLineDashPattern([1.1, 0.8], 0); } else pdf.setDrawColor(...BLUE);
        pdf.line(x1, yy, x2, yy); pdf.setLineDashPattern([], 0); };
      let ry = y + 5.2 + lines.length * lh(9.75) + 1.6;
      rLines.forEach((row, li) => {
        const ly = ry, dy = ly + 2.6, vy = ly + 7.3; ry += row.h;
        row.forEach(p => { const cx = p.x + p.c;
          if (p.g > 0) seg(p.x, cx, dy, p.lab === 'RETURN');
          if (p.g < last) seg(cx, p.x + p.w, dy, (pts[p.g + 1] || [])[0] === 'RETURN'); });
        row.forEach(p => { const cx = p.x + p.c, ret = p.lab === 'RETURN', end = p.lab === 'FROM' || p.lab === 'TO', col = ret ? ORANGE : BLUE;
          pdf.setLineWidth(0.55); pdf.setDrawColor(...col); pdf.setFillColor(...(end ? col : WHITE)); pdf.circle(cx, dy, 1.25, 'FD');
          font(6.8, true, col); pdf.text(p.lab, cx, ly, {align:'center'}); font(9.4, true); p.nl.forEach((t, j) => pdf.text(t, cx, vy + j * NLH, {align:'center'})); });
        if (li === 0 && it.when){
          const wx = k0.x + k0.w - PAD - rLines.dw;
          pdf.setDrawColor(...LINE); pdf.setLineWidth(0.25); pdf.line(wx - 3.5, ly - 2.2, wx - 3.5, vy + 0.8);
          font(6.8, true, BLUE); pdf.text('DATE', wx, ly); font(9.4, true); txt(it.when, wx, ly + 4.6);
        }
      });
    }
    y += rh; pdf.setDrawColor(...LINE); pdf.setLineWidth(0.25); pdf.line(L, y, R, y);
  });
  if (fill > 0.5){ y += fill; pdf.setDrawColor(...LINE); pdf.setLineWidth(0.25); pdf.line(L, y, R, y); }   // stretch the table down to the footer

  // totals
  const tRows = [];
  if (isDN) tRows.push(['Total', qfmt(qtyTotal(d)), 'gt']);
  else {
    tRows.push(['Sub Total', money(subtotal(d))]);
    if (discAmt(d)) tRows.push([discLabel(d), '-' + money(discAmt(d))]);
    if (num(d.taxRate)) tRows.push([`GST ${num(d.taxRate)}%`, money(taxAmt(d))]);
    tRows.push(['Grand Total', money(total(d)), 'gt']);
    const p = paidOf(d);
    if (d.type === 'invoice' && p > 0 && st !== 'paid'){ tRows.push(['Paid', money(p)]); tRows.push(['Balance due', money(balance(d)), 'bal']); }
  }
  const TH = 6.6;
  if (y + tRows.length * TH + 16 > BOTTOM){ pdf.addPage(); y = 16; }
  y += 2.5;
  const TW = 62, tx = R - TW, sumTop = y;
  tRows.forEach(([k, v, f]) => {
    if (f === 'gt'){ pdf.setFillColor(...BLUE); pdf.rect(tx, y, TW, TH, 'F'); font(10.5, true, WHITE); }
    else font(9.75, true, f === 'bal' ? [138,42,32] : INK);
    pdf.text(k, tx + 32 - PAD, y + 4.6, {align:'right'});
    if (f !== 'gt') pdf.setFont('FS', f === 'bal' ? 'bold' : 'normal');
    pdf.text(v, R - PAD, y + 4.6, {align:'right'});
    y += TH;
  });
  if (!isDN){
    // label and words on one line, level with the Grand Total row; wraps only if the words are too long
    const gtRow = tRows.findIndex(r => r[2] === 'gt');
    let wy = sumTop + gtRow * TH + 4.6;
    const lab = 'Amount in words (MVR): ', words = amountWords(total(d)), maxW = tx - L - 4;
    // shrink the text slightly for long amounts so it stays on one line
    let fs = 9.4;
    const fits = f => { font(f, true); const a = pdf.getTextWidth(lab); font(f, false); return a + pdf.getTextWidth(words) <= maxW; };
    while (fs > 7.4 && !fits(fs)) fs -= 0.2;
    font(fs, true); pdf.text(lab, L, wy); const lw = pdf.getTextWidth(lab);
    font(fs, false);
    let line = '', x = L + lw, avail = maxW - lw;
    words.split(' ').forEach(w => {
      const test = line ? line + ' ' + w : w;
      if (line && pdf.getTextWidth(test) > avail){ pdf.text(line, x, wy); wy += lh(fs); line = w; x = L; avail = maxW; }
      else line = test;
    });
    pdf.text(line, x, wy);
    y = Math.max(y, wy + 2);
  }
  if (showPaidStamp(d) && STAMP_PNG) pdf.addImage(STAMP_PNG, 'PNG', R - 50, y + 1, 48, 32, 'stamp-' + d.id, 'NONE');

  const ensure = need => { if (y + need > BOTTOM){ pdf.addPage(); y = 16; } };
  if (isDN){
    y += 8;
    font(9.75, false);
    [d.message, s.deliveryNote].filter(Boolean).forEach(p => { const ls = wrap(p, CW); ensure(ls.length * lh(9.75) + 2); ls.forEach(t => { pdf.text(t, L, y); y += lh(9.75); }); y += 2; });
    y += 6; ensure(40);
    const LX = 13, LW = 61;   // line starts 13mm after the label and is 61mm long
    const block = (x, title, rows, sign) => {
      let by = y; font(9.75, true); pdf.text(title, x, by);
      rows.forEach(([k, v], i) => {
        by += i === 0 ? 21 : 7;   // tall gap above the Sign line leaves room to sign by hand
        font(9.75, false, GREY); pdf.text(k, x, by);
        pdf.setDrawColor(150,150,150); pdf.setLineWidth(0.2); pdf.setLineDashPattern([0.4,0.8], 0); pdf.line(x + LX, by + 0.8, x + LX + LW, by + 0.8); pdf.setLineDashPattern([], 0);
        if (i === 0 && sign){   // signature centred on the Sign line
          const mw = LW * 0.92, mh = 15.5 * signScale(); let w = mw, h = w * sign.h / sign.w; if (h > mh){ h = mh; w = h * sign.w / sign.h; }
          const fmt = /^data:image\/jpe?g/i.test(sign.src) ? 'JPEG' : 'PNG';
          pdf.addImage(sign.src, fmt, x + LX + LW/2 - w/2, by + 2 - h, w, h, 'sign', 'NONE');
        }
        if (v){ font(9.75, false); txt(v, x + LX + 1.5, by); }
      });
      return by;
    };
    const sg = dnSigns(d);
    y += 2; ensure(46);
    const b1 = block(L, 'Delivered by:', [['Sign:',''],['Name:', sg.byName],['Date:', sg.byDate ? fmtDate(sg.byDate) : '']], s.signDelivery && SIGN_INFO);
    const b2 = block(L + CW/2 + 8, 'Received by:', [['Sign:',''],['Name:', sg.toName],['Date:', sg.toDate ? fmtDate(sg.toDate) : '']], null);
    y = Math.max(b1, b2) + 4;
  } else {
    y += 10;
    const terms = (d.terms || '').split('\n').map(t => t.trim()).filter(Boolean);
    if (terms.length){
      // Terms: blue heading with a short underline, each term with a thin line on the left
      ensure(14); font(9.75, true, BLUE); pdf.text('Terms & Conditions', L, y);
      pdf.setFillColor(...BLUE); pdf.rect(L, y + 1.3, tw('Terms & Conditions'), 0.55, 'F'); y += lh(9.75) + 2.2;
      terms.forEach(t => {
        font(9.4, false); const ls = wrap(t, CW - 48); ensure(ls.length * lh(9.4) + 1);
        // thin line on the same edge as the Bank Details bar; text starts where the bank text starts
        const top = y - 3; font(9.4, false); ls.forEach(l => { pdf.text(l, L + 4.2, y); y += lh(9.4); });
        pdf.setDrawColor(201, 214, 229); pdf.setLineWidth(0.45); pdf.line(L + 0.25, top, L + 0.25, y - lh(9.4) + 1.2); y += 1;
      });
      y += 3;
    }
    // Bank Details on the left, authorised signature on the right
    ensure(36); const bank = pdfBank(pdf, k, y);
    y = Math.max(bank.y, pdfAuthSign(pdf, k, bank.top));
  }

  const end = {y, pages: pdf.getNumberOfPages()};
  end.fTop = pdfFooter(pdf, k, y, T.label.toLowerCase(), d.number);
  return end;
}

// Dhivehi in the PDF: when a Dhivehi font (e.g. Faruma) is uploaded in Settings, the Thaana parts of every line are drawn
// in that font and the rest in the normal font. Text reaching pdf.text is already in visual order (see vis()).
function dvFontPatch(pdf){
  const f = S.settings.dvFont; if (!f) return;
  try { pdf.addFileToVFS('DV.ttf', f); pdf.addFont('DV.ttf', 'DV', 'normal'); } catch(e){ return; }
  const TH = /[\u0780-\u07BF]/, RUN = /([\u0780-\u07BF](?:[\u0780-\u07BF \u00A0\u060C\u061B\u061F]*[\u0780-\u07BF])?)/;
  const text0 = pdf.text.bind(pdf), width0 = pdf.getTextWidth.bind(pdf), runs = t => String(t).split(RUN).filter(x => x !== '');
  const inDV = fn => { const cur = pdf.getFont(), sz = pdf.getFontSize(); pdf.setFont('DV', 'normal'); pdf.setFontSize(sz * 1.08);
    try { return fn(); } finally { pdf.setFont(cur.fontName, cur.fontStyle); pdf.setFontSize(sz); } };
  const rw = r => TH.test(r) ? inDV(() => width0(r)) : width0(r);
  pdf.getTextWidth = t => TH.test(t) ? runs(t).reduce((a, r) => a + rw(r), 0) : width0(t);
  pdf.text = (t, x, y, o) => {
    if (typeof t !== 'string' || !TH.test(t)) return text0(t, x, y, o);
    const al = o && o.align, tot = pdf.getTextWidth(t), oo = {...(o || {})}; delete oo.align;
    let cx = al === 'right' ? x - tot : al === 'center' ? x - tot / 2 : x;
    runs(t).forEach(r => { if (TH.test(r)) inDV(() => text0(r, cx, y, oo)); else text0(r, cx, y, oo); cx += rw(r); });
    return pdf;
  };
}
function newPDF(title, subject){
  const pdf = new window.jspdf.jsPDF({unit:'mm', format:'a4', compress:true});
  pdf.addFileToVFS('FS-Regular.ttf', PDF_FONT_R); pdf.addFont('FS-Regular.ttf', 'FS', 'normal');
  pdf.addFileToVFS('FS-Bold.ttf', PDF_FONT_B); pdf.addFont('FS-Bold.ttf', 'FS', 'bold');
  dvFontPatch(pdf);
  pdf.setProperties({title, subject: subject || '', author: S.settings.name, creator: S.settings.name});
  return pdf;
}
async function buildPDF(d){
  await loadScript(JSPDF_URL);
  await footIcons(); await loadSignInfo();
  STAMP_PNG = showPaidStamp(d) ? await stampPNG(d) : null;
  const title = `${TYPES[d.type].label} ${d.number}`;
  // draw once to measure, then again with the item table stretched so a one-page document reaches the footer
  const probe = drawPDF(newPDF(title), d, 0);
  const fill = probe.pages === 1 ? Math.max(0, probe.fTop - 9 - probe.y) : 0;
  const pdf = newPDF(title, d.customer?.name);
  drawPDF(pdf, d, fill);
  const name = `${(d.number||'document').replace(/[\/\\]+/g,'-')} ${(d.customer?.name||'').replace(/[^\w .-]+/g,'').slice(0,40)}`.trim() + '.pdf';
  return {name, blob: pdf.output('blob')};
}
async function makePDF(d, btn){
  const label = btn.innerHTML; btn.disabled = true; btn.textContent = 'Preparing PDF…';
  try { const f = await buildPDF(d); await saveFile(f.name, f.blob); }
  catch(e){ console.error(e); toast('The PDF could not be created. Try Print, and choose "Save as PDF".'); }
  btn.disabled = false; btn.innerHTML = label;
}
// Short message that goes with the shared PDF
function shareText(d){
  const T = TYPES[d.type], s = S.settings, st = statusOf(d);
  const lines = [`${T.label} ${d.number}`, d.customer?.name ? `Customer: ${d.customer.name}` : '', `Date: ${fmtDate(d.date)}`];
  if (d.type === 'delivery') lines.push(`Total quantity: ${qfmt(qtyTotal(d))}`);
  else lines.push(`Total: MVR ${money(total(d))}`);
  if (d.type === 'invoice' && st !== 'paid' && st !== 'void') lines.push(`Balance due: MVR ${money(balance(d))} by ${fmtDate(addDays(d.date, d.dueDays))}`);
  if (d.type === 'quotation') lines.push(`Valid until: ${fmtDate(addDays(d.date, d.validDays))}`);
  lines.push('', s.name || '', [s.phone, s.email].filter(Boolean).join(' · '));
  return lines.filter((l, i) => l !== '' || i > 0).join('\n').trim();
}
let shareCache = null;   // the PDF from the last tap, reused if the browser needs a second tap
function shareTelegram(d, btn){
  return sharePDF(d.id + '|' + (d.updatedAt || '') + '|' + (S.settings.signImage || '').length, () => buildPDF(d), shareText(d), btn);
}
// Email: phones get the share sheet with the PDF attached (pick Mail or Gmail);
// computers download the PDF and open Gmail with the customer, subject and message filled in.
async function emailPDF(key, build, mail, btn){
  const label = btn.innerHTML; btn.disabled = true;
  try {
    let f = shareCache && shareCache.key === key ? shareCache : null;
    if (!f){ btn.textContent = 'Preparing PDF…'; f = shareCache = {key, ...(await build())}; }
    const file = new File([f.blob], f.name, {type:'application/pdf'});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      try { await navigator.share({files:[file], title: mail.subject, text: mail.body}); }
      catch(e){ if (e && e.name === 'NotAllowedError') toast('PDF is ready. Tap Email again.'); else if (!e || e.name !== 'AbortError') throw e; }
    } else {
      await saveFile(f.name, f.blob);
      window.open('https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(mail.to || '') + '&su=' + encodeURIComponent(mail.subject) + '&body=' + encodeURIComponent(mail.body), '_blank', 'noopener');
      toast('PDF downloaded. In Gmail, attach it with the 📎 button, then Send.');
    }
  } catch(e){ console.error(e); toast('Email didn\'t open here. Use Download PDF and attach it to an email.'); }
  btn.disabled = false; btn.innerHTML = label;
}
function docMail(d){
  const T = TYPES[d.type], s = S.settings, c = S.customers[d.customerId] || {};
  const who = (d.customer?.name || c.name || '').trim();
  return { to: c.email || '', subject: `${T.label} ${d.number} – ${s.name || ''}`.trim(),
    body: `Dear ${who || 'Sir/Madam'},\n\nPlease find attached ${T.label.toLowerCase()} ${d.number}.\n\n${shareText(d)}\n\nThank you.` };
}
function emailDoc(d, btn){ return emailPDF(d.id + '|' + (d.updatedAt || '') + '|' + (S.settings.signImage || '').length, () => buildPDF(d), docMail(d), btn); }
async function sharePDF(key, build, text, btn){
  const label = btn.innerHTML; btn.disabled = true;
  try {
    let f = shareCache && shareCache.key === key ? shareCache : null;
    if (!f){ btn.textContent = 'Preparing PDF…'; f = shareCache = {key, ...(await build())}; }
    const file = new File([f.blob], f.name, {type:'application/pdf'});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      // phones and some computers: share sheet with the PDF attached, then pick Telegram
      try { await navigator.share({files:[file], title: f.name, text}); }
      catch(e){ if (e && e.name === 'NotAllowedError') toast('PDF is ready. Tap Telegram again to share it.'); else if (!e || e.name !== 'AbortError') throw e; }
    } else {
      // computers without file sharing: save the PDF and open Telegram with the message ready
      await saveFile(f.name, f.blob);
      window.open('https://t.me/share/url?url=' + encodeURIComponent(text), '_blank', 'noopener');
      toast('PDF downloaded. In Telegram, pick the chat and attach the PDF with the 📎 button.');
    }
  } catch(e){ console.error(e); toast('Sharing didn\'t work here. Use Download PDF and send it in Telegram.'); }
  btn.disabled = false; btn.innerHTML = label;
}

const custState = {q:'', f:'all', sort:'name'};

  };

let prodQ = '', prodCat = 'all';
function viewProducts(main){

    (d.items || []).forEach(it => { const k = (it.desc || '').trim().toLowerCase(); if (k && !seen.has(k)){ seen.add(k); used[k] = (used[k] || 0) + 1; } }); });

  };

        + `<td class="dim p-used">${n ? `${n} document${n === 1 ? '' : 's'}` : 'Not used yet'}</td>`
        + `<td class="p-act">${own ? `<div class="pacts"><button type="button" class="ia pe" data-pe title="Edit" aria-label="Edit ${esc(p.name)}">✎</button><button type="button" class="ia" data-pd title="Duplicate" aria-label="Duplicate ${esc(p.name)}">⧉</button><button type="button" class="ia" data-pm title="More" aria-label="More for ${esc(p.name)}">⋯</button></div>` : ''}</td></tr>`; }).join('')

}
// small menu next to a button: items are [label, action, 'danger'?]
function popMenu(btn, items){

  const r = btn.getBoundingClientRect(); m.style.top = (r.bottom + scrollY + 4) + 'px'; m.style.left = (Math.max(8, Math.min(r.right - m.offsetWidth, innerWidth - m.offsetWidth - 8)) + scrollX) + 'px';

/* ---------- team (Settings) ---------- */
const FIRESTORE_RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    // Evershine document portal: owner / staff / viewer (managed in Settings → Team)
    function signedIn() {
      return request.auth != null && request.auth.token.email != null
        && (request.auth.token.email_verified == true || request.auth.token.email.lower() == '${OWNER_EMAIL}');
    }
    function me() { return request.auth.token.email.lower(); }
    function onTeam() { return exists(/databases/$(database)/documents/team/$(me())); }
    function teamRole() { return get(/databases/$(database)/documents/team/$(me())).data.role; }
    function isOwner() { return signedIn() && (me() == '${OWNER_EMAIL}' || (onTeam() && teamRole() == 'owner')); }
    function canRead() { return isOwner() || (signedIn() && onTeam() && teamRole() in ['staff', 'viewer']); }
    function canWrite() { return isOwner() || (signedIn() && onTeam() && teamRole() == 'staff'); }
    function isVoid(data) { return data.get('status', '') in ['void', 'cancelled']; }

    match /team/{email} {
      allow read: if isOwner() || (signedIn() && email == me());
      allow write: if isOwner();
    }
    match /settings/{id} {
      allow read: if canRead();
      allow write: if isOwner();
    }
    match /customers/{id} {
      allow read: if canRead();
      allow create, update: if canWrite();
      allow delete: if isOwner();
    }
    match /docs/{id} {
      allow read: if canRead();
      allow create: if canWrite() && !isVoid(request.resource.data);
      allow update: if isOwner() || (canWrite() && !isVoid(resource.data) && !isVoid(request.resource.data));
      allow delete: if isOwner();   // single documents are voided; only the owner's "Delete all documents" (Settings → Backup) deletes
    }
    match /expenses/{id} {
      allow read, create, update: if canWrite();   // owner and staff; viewers don't see costs
      allow delete: if isOwner();
    }
    match /places/{id} {
      allow read: if canRead();
      allow create, update, delete: if canWrite();   // custom trip places (resorts…) for the island picker
    }
  }
}`;

  window.addEventListener('hashchange', () => { if (typeof unsub === 'function') unsub(); }, {once:true});

  $('#tm-add').addEventListener('click', async () => {

    if (email === OWNER_EMAIL) return toast('That is the main owner, who already has full access.');
    if (await save(email, role)){ $('#tm-e').value = ''; toast(`${email} added as ${ROLES[role][0]}`); }
  });
  list.addEventListener('change', async e => { const sel = e.target.closest('[data-tm-role]'); if (sel && await save(sel.dataset.tmRole, sel.value)) toast(`${sel.dataset.tmRole} is now ${ROLES[sel.value][0]}`); });
  list.addEventListener('click', e => {
    const b = e.target.closest('[data-tm-rm]'); if (!b) return;

    confirmBox(`Remove ${email}?`, 'They will no longer be able to open the portal. Documents they made stay.', 'Remove', async () => { try { await col.doc(email).delete(); toast(`${email} removed`); } catch(e){ dbErr(e); } });
  });
  const cp = $('#rules-copy');
  if (cp) cp.addEventListener('click', async () => { const t = $('#rules-text'); try { await navigator.clipboard.writeText(t.value); } catch(e){ t.select(); document.execCommand('copy'); } toast('Rules copied. Paste them in Firebase → Firestore Database → Rules, then Publish.'); });
}

/* ---------- signature image ---------- */
// Shrinks the image, makes a white paper background transparent (uploads) and trims empty edges.
function cleanSignature(url, knockWhite, cut = 200, crop = null){
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const k = crop || {x:0, y:0, w:1, h:1};   // crop box as fractions of the image
      const sx = k.x * im.naturalWidth, sy = k.y * im.naturalHeight, sw = Math.max(1, k.w * im.naturalWidth), sh = Math.max(1, k.h * im.naturalHeight);
      const sc = Math.min(1, 900 / sw, 400 / sh);
      const w = Math.max(1, Math.round(sw * sc)), h = Math.max(1, Math.round(sh * sc));
      const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.drawImage(im, sx, sy, sw, sh, 0, 0, w, h);
      const px = x.getImageData(0, 0, w, h), a = px.data;
      let x0 = w, y0 = h, x1 = -1, y1 = -1;
      for (let i = 0; i < a.length; i += 4){
        if (knockWhite){ const l = (a[i] + a[i+1] + a[i+2]) / 3; if (l > cut) a[i+3] = 0; else if (l > cut - 50) a[i+3] = Math.round(a[i+3] * (cut - l) / 50); }

      }
      if (x1 < 0) return res(null);
      x.putImageData(px, 0, 0);
      const pad = 6; x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
      const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
      o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
      res(o.toDataURL('image/png'));
    };
    im.onerror = () => res(null); im.src = url;
  });
}
// Adjust a signature before using it: remove the paper background and choose the printed size.
function signatureEditor(srcUrl, opts, done){
  const o = {bg: opts.bg !== false, strength: opts.strength ?? 45, size: Math.round(signScale({signScale: opts.size}) * 100), crop:{x:0, y:0, w:1, h:1}};

        <div class="cropstage" id="se-stage"><img id="se-cimg" src="${srcUrl}" alt="" draggable="false"><div class="cropbox" id="se-box"><i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i></div></div>
        <div class="row" style="justify-content:space-between;margin-top:10px"><span class="dim">Drag the box, or its corners, around the signature.</span>
          <span class="row"><button type="button" class="btn sm" id="se-creset">Reset</button><button type="button" class="btn sm primary" id="se-cdone">Apply crop</button></span></div>
      </div>
      <div class="sliders" id="se-sliders">
        <label class="chk"><input type="checkbox" id="se-bg" ${o.bg ? 'checked' : ''}>Remove background</label>
        <div><label for="se-st"><span>Background removal strength</span><span id="se-stv"></span></label><input type="range" id="se-st" min="0" max="100" value="${o.strength}"></div>
        <div><label for="se-sz"><span>Size on the document</span><span id="se-szv"></span></label><input type="range" id="se-sz" min="50" max="150" step="5" value="${o.size}"></div>
      </div>
      <p class="dim" style="margin:0">The preview shows the Sign line at its real proportions. The checkered pattern shows where the background has been removed.</p></div>`,
    'Use this signature', () => { if (!out){ toast('This image has no visible signature. Lower the strength or turn off background removal.'); return false; } done(out, o.size / 100); });
  const bg = w.querySelector('#se-bg'), st = w.querySelector('#se-st'), sz = w.querySelector('#se-sz');
  const cut = () => Math.round(250 - o.strength * 1.1);     // 0 → keeps almost everything, 100 → removes light greys too
  const paint = () => {
    w.querySelector('#se-stv').textContent = o.bg ? (o.strength < 30 ? 'Light' : o.strength < 70 ? 'Medium' : 'Strong') : 'Off';
    w.querySelector('#se-szv').textContent = o.size + '%';
    st.disabled = !o.bg; w.querySelector('#se-doc').classList.toggle('check', o.bg);
    w.querySelector('#se-line').innerHTML = out ? `<img src="${out}" alt="Signature preview" style="max-height:${Math.round(90 * o.size / 100)}px">` : '<span class="dim" style="position:absolute;left:0;right:0;bottom:30px;text-align:center">Nothing left to show</span>';
  };
  const run = async () => { const n = ++busy; const r = await cleanSignature(srcUrl, o.bg, cut(), o.crop); if (n === busy){ out = r; paint(); } };
  // crop box: move by dragging inside it, resize by dragging a corner
  const stage = w.querySelector('#se-stage'), box = w.querySelector('#se-box'), okBtn = w.querySelector('[data-ok]');
  let cr = {...o.crop}, drag = null;
  const drawBox = () => Object.assign(box.style, {left: cr.x * 100 + '%', top: cr.y * 100 + '%', width: cr.w * 100 + '%', height: cr.h * 100 + '%'});
  const cropMode = on => {
    w.querySelector('#se-cropper').hidden = !on; w.querySelector('#se-view').hidden = on; w.querySelector('#se-sliders').hidden = on; okBtn.style.display = on ? 'none' : '';
    if (on){ cr = {...o.crop}; drawBox(); }
  };
  const cropInfo = () => { const full = o.crop.w > 0.999 && o.crop.h > 0.999; w.querySelector('#se-cropinfo').textContent = full ? '' : 'Cropped'; };
  box.addEventListener('pointerdown', e => {
    e.preventDefault(); box.setPointerCapture(e.pointerId);
    drag = {h: e.target.dataset.h || 'move', px: e.clientX, py: e.clientY, c: {...cr}};
  });
  box.addEventListener('pointermove', e => {
    if (!drag) return;
    const r = stage.getBoundingClientRect(), dx = (e.clientX - drag.px) / r.width, dy = (e.clientY - drag.py) / r.height, c = drag.c, MIN = 0.06;
    const cl = (v, a, b) => Math.min(b, Math.max(a, v));
    if (drag.h === 'move'){ cr.x = cl(c.x + dx, 0, 1 - c.w); cr.y = cl(c.y + dy, 0, 1 - c.h); }
    else {
      if (drag.h.includes('w')){ cr.x = cl(c.x + dx, 0, c.x + c.w - MIN); cr.w = c.x + c.w - cr.x; }
      if (drag.h.includes('e')){ cr.w = cl(c.w + dx, MIN, 1 - c.x); }
      if (drag.h.includes('n')){ cr.y = cl(c.y + dy, 0, c.y + c.h - MIN); cr.h = c.y + c.h - cr.y; }
      if (drag.h.includes('s')){ cr.h = cl(c.h + dy, MIN, 1 - c.y); }
    }

  });
  const end = () => { drag = null; }; box.addEventListener('pointerup', end); box.addEventListener('pointercancel', end);

  w.querySelector('#se-creset').addEventListener('click', () => { cr = {x:0, y:0, w:1, h:1}; drawBox(); });
  w.querySelector('#se-cdone').addEventListener('click', () => { o.crop = {...cr}; cropMode(false); cropInfo(); run(); });
  bg.addEventListener('change', () => { o.bg = bg.checked; run(); });
  st.addEventListener('input', () => { o.strength = +st.value; run(); });
  sz.addEventListener('input', () => { o.size = +sz.value; paint(); });
  paint(); run();
}
function signaturePad(done){
  const w = modal('Draw your signature', `<canvas id="pad" width="900" height="340" style="width:100%;height:auto;aspect-ratio:900/340;background:#fff;border:1px solid var(--line);border-radius:12px;touch-action:none;cursor:crosshair"></canvas>
    <div class="row" style="justify-content:space-between"><span class="dim">Sign inside the box with your finger or mouse.</span><button type="button" class="btn sm" id="pad-clr">Clear</button></div>`,
    'Use this signature', async () => { if (!drawn){ toast('Draw your signature first.'); return false; } done(cv.toDataURL('image/png')); });
  const cv = w.querySelector('#pad'), g = cv.getContext('2d'); let drawn = false, last = null;
  g.lineWidth = 4.5; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#1b2a4a';
  const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); last = pt(e); g.beginPath(); g.arc(last[0], last[1], 2, 0, 7); g.fillStyle = g.strokeStyle; g.fill(); drawn = true; });
  cv.addEventListener('pointermove', e => { if (!last) return; const p = pt(e); g.beginPath(); g.moveTo(last[0], last[1]); g.lineTo(p[0], p[1]); g.stroke(); last = p; });
  const up = () => { last = null; }; cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  w.querySelector('#pad-clr').addEventListener('click', () => { g.clearRect(0, 0, cv.width, cv.height); drawn = false; });
}

  $('#sig-file').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
    const url = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.onerror = () => r(null); fr.readAsDataURL(f); });
    if (!url || !await cleanSignature(url, false)) return toast('That image could not be used. Try a PNG or JPG.');
    signatureEditor(url, {bg:true, size:s.signScale}, useSig);
  });
  $('#sig-rm').addEventListener('click', () => { s.signImage = ''; s.signScale = 1; sigShow(); toast('Back to the default signature. Click Save to keep it.'); dirty = true; });
  const useSig = (img, scale) => { s.signImage = img; s.signScale = scale; sigShow(); toast('Signature ready. Click Save to keep it.'); dirty = true; };
  const fitWording = () => $('#wording').querySelectorAll('textarea').forEach(t => { t.style.height = 'auto'; t.style.height = (t.scrollHeight + 2) + 'px'; });
  fitWording(); $('#wording').addEventListener('input', fitWording);   // show the whole text, no inner scrolling
  // open / close a section (one at a time); an unsaved edit asks before it is dropped
  let dirty = false;
  $('#sf').addEventListener('input', e => { if (!e.target.closest('#teampanel')) dirty = true; }); $('#sf').addEventListener('change', e => { if (!e.target.closest('#teampanel')) dirty = true; });
  const editing = () => main.querySelector('.srow.editing');
  const setOpen = (row, on) => { row.classList.toggle('open', on); row.querySelector('.shead').setAttribute('aria-expanded', on); row.querySelector('.sbody').hidden = !on; if (on) fitWording(); };
  const lock = (row, on) => { row.classList.toggle('editing', !on); row.querySelectorAll('.lockset').forEach(f => { f.disabled = on; });
    const e = row.querySelector('.sec-edit'), a = row.querySelector('.sact'); if (a) a.hidden = on;
    if (e){ e.hidden = !on && !!a; e.textContent = on ? '✎ Edit' : '🔒 Lock'; } const m = row.querySelector('.lockmsg'); if (m) m.textContent = on ? 'Locked so nothing changes by mistake.' : 'Editing…'; };
  const again = k => { const y = scrollY; viewSettings(main, k); scrollTo(0, y); };   // fresh copy of the saved settings
  main.querySelectorAll('.shead').forEach(h => h.addEventListener('click', () => {
    const row = h.closest('.srow'), on = !row.classList.contains('open'), ed = editing();
    if (ed && dirty && !confirm('Discard the changes you haven\'t saved?')) return;
    if (ed && dirty) return again(on ? row.dataset.sec : null);
    if (ed) lock(ed, true);
    main.querySelectorAll('.srow.open').forEach(r => setOpen(r, false));
    if (on){ setOpen(row, true); const t = row.getBoundingClientRect().top; if (t < 70 || t > innerHeight - 120) row.scrollIntoView({block:'start', behavior:'smooth'}); }
  }));
  main.querySelectorAll('.sec-edit').forEach(b => b.addEventListener('click', () => {
    const row = b.closest('.srow'), on = row.classList.contains('editing');
    lock(row, on);
    if (!on){ const f = row.querySelector('.lockset input:not([hidden]):not([type=file]),.lockset textarea'); if (f) f.focus(); fitWording(); }
  }));
  main.querySelectorAll('.s-cancel').forEach(b => b.addEventListener('click', () => again(b.closest('.srow').dataset.sec)));
  main.querySelectorAll('.s-save').forEach(b => b.addEventListener('click', async () => {
    b.disabled = true;
    s.quoteValidDays = num(s.quoteValidDays) || 20; s.invoiceDueDays = num(s.invoiceDueDays) || 5; s.signDelivery = !!s.signDelivery; s.signDocs = !!s.signDocs;
    s.prefix = (s.prefix||'ESC').trim().replace(/[\/\s]+/g,'') || 'ESC';
    ['QTN', 'INV', 'DN'].forEach(c => { const v = Math.floor(num(s['start' + c])); s['start' + c] = v > 0 ? v : ''; });
    s.startYY = todayISO().slice(2,4);   // the next numbers apply to this year
    s.products = S.settings.products || [];
    try { await saveSettings(s); toast('Saved'); again(b.closest('.srow').dataset.sec); } catch(err){ b.disabled = false; }
  }));
  if (openKey){ const r = main.querySelector(`.srow[data-sec="${openKey}"]`); if (r) setOpen(r, true); }
  $('#sig-draw').addEventListener('click', () => signaturePad(url => setTimeout(() => signatureEditor(url, {bg:true, size:s.signScale}, useSig), 0)));
  $('#sig-adj').addEventListener('click', () => signatureEditor(s.signImage || SIGN, {bg:true, size:s.signScale}, useSig));
  $('#sf').addEventListener('change', e => { const k = e.target.dataset.s; if (k) s[k] = e.target.value; });
  const backup = () => {
    const data = {app:'evershine-portal', version:1, exportedAt:new Date().toISOString(), settings:S.settings, customers:S.customers, docs:S.docs, expenses:S.expenses};
    saveFile(`evershine-backup-${todayISO()}.json`, JSON.stringify(data, null, 1));
  };
  $('#bk-exp').addEventListener('click', backup);
  // Owner only: remove every quotation, invoice and delivery note (e.g. to start fresh). A backup downloads first.
  $('#bk-wipe').addEventListener('click', () => {
    if (!isOwnerRole()) return toast('Only the owner can do this.');
    const all = Object.values(S.docs), c = t => all.filter(d => d.type === t).length;
    if (!all.length) return toast('There are no documents to delete.');
    modal('Delete all documents?', `<p style="margin:0 0 10px">This permanently deletes <b>${c('quotation')} quotations, ${c('invoice')} invoices and ${c('delivery')} delivery notes</b>. Customers, products, expenses and settings stay.</p>
      <p style="margin:0 0 12px">A backup file downloads first, so they can be restored later with <b>Restore from backup</b> if ever needed.</p>
      <div class="fld"><label for="wipe-t">Type DELETE to confirm</label><input id="wipe-t" autocomplete="off" autocapitalize="characters"></div>`, 'Delete all documents', async w => {
        if (w.querySelector('#wipe-t').value.trim().toUpperCase() !== 'DELETE'){ toast('Type DELETE to confirm.'); return false; }
        backup();
        let n = 0;
        for (const d of all){
          try { await del('docs', d.id); n++; if (n % 10 === 0) toast(`Deleting… ${n} of ${all.length}`); }
          catch(e){ toast(n ? `Stopped after ${n} documents. Firebase refused the rest: paste the updated security rules (Settings → Team) and try again.` : 'Firebase refused to delete. Paste the updated security rules (Settings → Team → Security rules) into Firebase, then try again.'); return; }
        }
        toast(`${n} documents deleted`);
      }, true);
  });
  $('#bk-imp').addEventListener('click', () => $('#bk-file').click());
  const so2 = $('#so2'); if (so2) so2.addEventListener('click', () => window.__signOut());
  $('#bk-file').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
    let data; try { data = JSON.parse(await f.text()); } catch(err){ return toast('That file isn\'t a portal backup.'); }
    if (!data || data.app !== 'evershine-portal' || typeof data.docs !== 'object'){ return toast('That file isn\'t a portal backup.'); }
    const nd = Object.keys(data.docs||{}).length, nc = Object.keys(data.customers||{}).length;
    confirmBox('Restore this backup?', `This adds ${nd} documents and ${nc} customers from ${fmtDate((data.exportedAt||'').slice(0,10)) || 'the backup'}, plus its settings. Records with the same ID are replaced; everything else stays.`, 'Restore backup', async () => {
      let n = 0;
      for (const [id, c] of Object.entries(data.customers||{})){ await put('customers', id, c); n++; }
      for (const [id, x] of Object.entries(data.expenses||{})){ try { await put('expenses', id, x); } catch(e){} }
      for (const [id, d] of Object.entries(data.docs||{})){ await put('docs', id, d); n++; if (n % 10 === 0) toast(`Restoring… ${n} of ${nd+nc}`); }
      if (data.settings) await saveSettings(data.settings);
      toast(`Backup restored: ${nd} documents, ${nc} customers`);
    });
  });
}

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  let t = document.querySelector('.toast'); if (!t){ t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status'); document.body.appendChild(t); }
  t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3400);
}

boot();
</script>

<style>
.login[hidden]{display:none!important}
.login{position:fixed;inset:0;z-index:80;background:var(--shell,#eef0f4);display:grid;place-items:center;padding:20px}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:32px;width:min(400px,100%);display:grid;gap:14px;box-shadow:0 20px 50px rgba(16,24,40,.10)}
.login .lg{display:flex;align-items:center;gap:12px}
.login .lg img{width:64px;height:auto;background:#fff;border-radius:8px;padding:4px;border:1px solid var(--line)}
.login h1{margin:0;font-family:var(--ui);font-weight:800;font-size:22px;line-height:1.15}
.login .alert{margin:0;padding:12px 14px;border-radius:10px;font-size:14.5px;line-height:1.4;background:#fdf0dc;color:#9a5b00;border:1px solid #f6dcb0}
.login .alert b{display:block;margin-bottom:2px}
.login .alert.info{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.login .alert[hidden]{display:none}
.login .busy{display:none;align-items:center;gap:10px;color:var(--muted);font-weight:600;padding:8px 0}
.login .busy i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--brand);animation:lspin .8s linear infinite}
@keyframes lspin{to{transform:rotate(360deg)}}
.login.checking .busy{display:flex}
.login.checking form>*:not(.lg):not(.busy){display:none!important}
.login .lnk{background:none;border:0;color:var(--brand);cursor:pointer;padding:0;font-size:14px;justify-self:start}
.login .gbtn{justify-content:center;gap:10px;padding:11px 16px;font-size:15px}

.login .or::before,.login .or::after{content:"";flex:1;height:1px;background:var(--line)}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, setDoc, deleteDoc, getDoc, query, limit }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signInWithCredential }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const cfg = window.FIREBASE_CONFIG;
const configured = cfg && cfg.apiKey && !String(cfg.apiKey).startsWith('PASTE');

const box = document.createElement('div');
box.className = 'login checking';   // covers the portal until we know who is signed in and that they're on the team
box.innerHTML = `<form id="lf" novalidate>
  <div class="lg"><img src="${LOGO}" alt=""><h1>${esc(DEFAULTS.name)}<br><span class="dim" style="font-size:17px;font-weight:500">Document portal</span></h1></div>
  <div class="busy" id="lbusy"><i></i><span>Checking sign-in…</span></div>
  <div class="alert" id="lerr" role="alert" hidden></div>
  <div id="gsi" hidden></div>
  <button class="btn gbtn" id="lg" type="button"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>Sign in with Google</button>
  <div class="or"><span>or with email and password</span></div>
  <div class="fld"><label for="le">Email</label><input id="le" type="email" autocomplete="username" required></div>
  <div class="fld"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required></div>
  <button class="btn primary" id="lb" type="submit" style="justify-content:center">Sign in</button>
  <button class="lnk" id="lr" type="button">Forgot password?</button>
</form>`;
document.body.appendChild(box);
const $e = id => box.querySelector('#' + id);
// message box above the sign-in buttons: kind 'err' (amber, "Login failed!") or 'info'
const setMsg = (msg, kind = 'err', title) => {
  const a = $e('lerr'); a.hidden = !msg; a.className = 'alert' + (kind === 'info' ? ' info' : '');
  a.innerHTML = msg ? `<b>${esc(title || (kind === 'info' ? '' : 'Login failed!'))}</b>${esc(msg)}` : '';
  if (kind === 'info' && !title) a.querySelector('b').remove();
};
const busy = text => { box.hidden = false; box.classList.add('checking'); box.querySelector('#lbusy span').textContent = text || 'Checking sign-in…'; };
const showLogin = (msg, kind, title) => {
  box.hidden = false; box.classList.remove('checking'); setMsg(msg, kind, title);
  $e('lb').disabled = false; $e('lg').disabled = false;
};


if (!configured){
  showLogin('Firebase is not set up yet. Paste your Firebase config into index.html (see the setup guide).');
  $e('lb').disabled = true; $e('lg').disabled = true;
} else {
  const app = initializeApp(cfg);
  const fs = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  const auth = getAuth(app);

  const mapErr = e => ({ code: e && e.code === 'permission-denied' ? 'invalid_argument' : e && e.code === 'resource-exhausted' ? 'resource_exhausted' : 'unavailable', message: e && e.message || '' });
  // Writes save to this device first; if the connection is slow the app carries on and Firebase syncs in the background.
  const soft = p => new Promise((res, rej) => {
    let late = false; const t = setTimeout(() => { late = true; res(); }, 2500);
    p.then(() => { if (!late){ clearTimeout(t); res(); } })
     .catch(e => { const m = mapErr(e); if (!late){ clearTimeout(t); rej(m); } else if (window.dbErr) window.dbErr(m); });
  });
  const denied = () => showLogin('This account is not allowed to use the portal. Ask the owner to add your email under Settings → Team.', 'err', 'No access');
  const docRef = path => { const r = doc(fs, path); return {
    set: body => soft(setDoc(r, body)),
    delete: () => soft(deleteDoc(r)),
    get: () => getDoc(r).then(s => ({ exists: s.exists(), data: () => s.data() }), e => { throw mapErr(e); }),
    onSnapshot: (next, err) => onSnapshot(r, s => next({ exists: s.exists(), data: () => s.data() }),
      e => { if (e.code === 'permission-denied') denied(); err && err(mapErr(e)); })
  }; };
  const colRef = (name, n) => ({
    limit: k => colRef(name, k),
    doc: id => docRef(name + '/' + id),
    onSnapshot: (next, err) => onSnapshot(n ? query(collection(fs, name), limit(n)) : collection(fs, name),
      s => next({ docs: s.docs.map(d => ({ id: d.id, data: () => d.data() })) }),
      e => { if (e.code === 'permission-denied' && !['expenses','team','places'].includes(name)) denied(); err && err(mapErr(e)); })
  });
  const adapter = { collection: name => colRef(name), doc: path => docRef(path) };

  // Who may use the portal: the main owner, or anyone in the `team` collection (Settings → Team).
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]);
  const checkAccess = async user => {
    const e = String(user.email || '').trim().toLowerCase();
    if (e === OWNER_EMAIL) return { role: 'owner' };
    try {
      const s = await withTimeout(getDoc(doc(fs, 'team/' + e)), 12000);
      if (!s.exists()) return { role: null };
      const r = (s.data() || {}).role; return { role: ROLES[r] ? r : 'viewer' };
    } catch(err){
      if (err.code === 'permission-denied'){
        // Older rules that don't know about the team list: keep this account's previous access if it can still read the data
        try { await withTimeout(getDoc(doc(fs, 'settings/company')), 12000); return { role: 'owner', legacy: true }; }
        catch(e2){ return { role: null, why: e2.code === 'permission-denied' ? 'denied' : 'offline' }; }
      }
      return { role: null, why: 'offline' };
    }
  };
  let started = false, pendingMsg = null;
  onAuthStateChanged(auth, async user => {
    if (user){
      if (started) return;
      busy('Checking access…');
      const acc = await checkAccess(user);
      if (!acc.role){
        pendingMsg = acc.why === 'offline'
          ? ['Couldn\'t check your access. Check your internet connection and try again.', 'Connection problem']
          : [`${user.email} isn't on the Evershine team yet. Ask the owner to add this email under Settings → Team.`, 'No access'];
        await signOut(auth); return;
      }
      started = true; box.hidden = true;
      window.__fbResolve({ db: adapter, email: user.email, role: acc.role, legacy: !!acc.legacy, signOut: () => signOut(auth) });
    } else {
      if (started) location.reload();
      else { const m = pendingMsg; pendingMsg = null; m ? showLogin(m[0], 'err', m[1]) : showLogin(''); }
    }
  });

  $e('lf').addEventListener('submit', async ev => {
    ev.preventDefault();
    const email = $e('le').value.trim(), pw = $e('lp').value;
    if (!email || !pw){ setMsg('Enter your email and password.'); return; }
    $e('lb').disabled = true; setMsg('');
    try { await signInWithEmailAndPassword(auth, email, pw); }
    catch(e){
      $e('lb').disabled = false;
      setMsg(e.code === 'auth/too-many-requests' ? 'Too many attempts. Wait a few minutes and try again.'
        : e.code === 'auth/network-request-failed' ? 'No internet connection. Check your connection and try again.'
        : 'Check your email and password.');
    }
  });
  const gErr = e => e.code === 'auth/unauthorized-domain' ? 'Google sign-in isn\'t allowed on this web address yet. Add it in Firebase → Authentication → Settings → Authorized domains.'
    : e.code === 'auth/operation-not-allowed' ? 'Google sign-in is not turned on yet in Firebase → Authentication → Sign-in method.'
    : e.code === 'auth/network-request-failed' ? 'No internet connection. Check your connection and try again.'
    : e.code === 'auth/account-exists-with-different-credential' ? 'This email already signs in another way. Use email and password.'
    : 'Google sign-in didn\'t finish. Try again.';
  getRedirectResult(auth).catch(e => showLogin(gErr(e)));
  // Google's own button (Google Identity Services): the account picker opens straight from accounts.google.com
  if (window.GOOGLE_CLIENT_ID){
    const sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
    sc.onload = () => {
      const g = window.google && google.accounts && google.accounts.id; if (!g) return;
      g.initialize({ client_id: window.GOOGLE_CLIENT_ID, ux_mode: 'popup', itp_support: true, auto_select: false, cancel_on_tap_outside: true,
        callback: async res => {
          busy('Signing in…');
          try { await signInWithCredential(auth, GoogleAuthProvider.credential(res.credential)); }
          catch(e){ showLogin(gErr(e)); }
        } });
      const holder = $e('gsi'), w = Math.min(400, Math.max(220, $e('lf').clientWidth - 64 || 320));
      g.renderButton(holder, { type: 'standard', theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', logo_alignment: 'center', width: w });
      holder.hidden = false; $e('lg').hidden = true;   // the Firebase helper button stays as the fallback if Google's script can't load
    };
    document.head.appendChild(sc);
  }
  $e('lg').addEventListener('click', async () => {
    $e('lg').disabled = true; setMsg('');
    const provider = new GoogleAuthProvider(); provider.setCustomParameters({ prompt: 'select_account' });
    try { await signInWithPopup(auth, provider); }
    catch(e){
      if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment'){ try { await signInWithRedirect(auth, provider); return; } catch(e2){ e = e2; } }
      $e('lg').disabled = false;
      if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') setMsg(gErr(e));
    }
  });
  $e('lr').addEventListener('click', async () => {
    const email = $e('le').value.trim();
    if (!email){ setMsg('Type your email above first, then click Forgot password.', 'info'); return; }
    try { await sendPasswordResetEmail(auth, email); setMsg('If that email has an account, a reset link is on its way.', 'info'); }
    catch(e){ setMsg('Could not send the reset email. Check the address and try again.'); }
  });
}
</script>

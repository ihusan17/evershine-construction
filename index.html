  --ui:"Plus Jakarta Sans","Faruma","Noto Sans Thaana","Segoe UI",system-ui,sans-serif;
  --cond:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --serif:Cambria,"Source Serif 4","Faruma","Noto Sans Thaana",Georgia,serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171d; --surface:#1a2129; --surface-2:#222a33; --ink:#e6eaee; --muted:#9aa6b2; --line:#2e3844;
    --brand:#79a6d8; --brand-2:#9bbde4; --brand-ink:#0e1620; --brand-soft:#1f3044; --sand:#2e2a22;
    --shell:#0d1116; --shadow:none;
    --ok:#6cc08f; --ok-soft:#1d3327; --warn:#e0a94a; --warn-soft:#3a2e17; --bad:#ef7e72; --bad-soft:#3d201d; --neutral-soft:#262e37;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1a2129; --surface-2:#222a33; --ink:#e6eaee; --muted:#9aa6b2; --line:#2e3844;
  --brand:#79a6d8; --brand-2:#9bbde4; --brand-ink:#0e1620; --brand-soft:#1f3044; --sand:#2e2a22;
  --shell:#0d1116; --shadow:none;
  --ok:#6cc08f; --ok-soft:#1d3327; --warn:#e0a94a; --warn-soft:#3a2e17; --bad:#ef7e72; --bad-soft:#3d201d; --neutral-soft:#262e37;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand .tile{background:#fff;border-radius:8px;padding:4px;width:52px;height:44px;display:grid;place-items:center;border:1px solid var(--line);flex:none}
.brand .tile img{width:100%;height:100%;object-fit:contain}
.brand b{font-family:var(--cond);font-size:17px;letter-spacing:.02em;line-height:1.05;display:block;overflow-wrap:anywhere}
.brand small{color:var(--muted);font-size:13px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:7px;color:var(--ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav .cnt{font-size:12px;font-weight:600;min-width:22px;text-align:center;padding:1px 7px;border-radius:20px;background:var(--surface-2);color:var(--muted)}
.nav .cnt.hot{background:var(--bad-soft);color:var(--bad)}
.side h6{margin:0 12px 4px;font-size:13px;color:var(--muted);font-weight:600}
.quick{display:flex;flex-direction:column;gap:2px}
.quick a{padding:7px 12px;border-radius:7px;text-decoration:none;color:var(--ink);font-size:15px}
.quick a:hover{background:var(--surface-2)}
.quick a::before{content:"+";display:inline-block;width:16px;color:var(--brand);font-weight:700}
.sync{margin-top:auto;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start;padding:0 12px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);margin-top:6px;flex:none}
.sync[hidden]{display:none}
.sync.cloud i{background:var(--ok)} .sync.local i{background:var(--warn)}

main{padding:28px 32px 60px;min-width:0}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead h1{margin:0;font-family:var(--cond);font-weight:700;font-size:34px;line-height:1.05;letter-spacing:.01em}
.pagehead p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
/* Settings: summary list; a section opens underneath its line */
.slist{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.srow+.srow{border-top:1px solid var(--line)}
.shead{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.shead:hover{background:var(--surface-2)}
.srow.open>.shead{background:var(--brand-soft)}
.sico{width:38px;height:38px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.srow.open .sico{background:var(--surface)}
.sico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.shead .t{display:grid;gap:2px;min-width:0;flex:1}
.shead .t b{font-size:15px}
.shead .sum{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shead .chev{font-style:normal;color:var(--muted);font-size:22px;line-height:1;transition:transform .15s}
.srow.open .shead .chev{transform:rotate(90deg)}
.sbody{border-top:1px solid var(--line)}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px 0;font-size:13px}
.srow.editing .lockmsg{color:var(--brand);font-weight:600}
.sact{display:flex;justify-content:flex-end;gap:8px;padding:0 18px 16px}
.srow .rules{border-top:1px solid var(--line)}
.srow [hidden]{display:none!important}
.dvprev{display:flex;gap:28px;flex-wrap:wrap;font-size:22px;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;background:var(--surface);direction:ltr}
/* Settings: locked sections read like plain text until Edit is clicked */
fieldset.lockset{border:0;margin:0;padding:0;min-width:0}
fieldset.lockset.inline{display:contents}
fieldset.lockset:disabled input,fieldset.lockset:disabled textarea,fieldset.lockset:disabled select{background:var(--surface-2);border-color:transparent;color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:1;cursor:default;resize:none}
fieldset.lockset:disabled select{appearance:none;-webkit-appearance:none;background-image:none}
fieldset.lockset:disabled button{opacity:.45;cursor:default}
.sec-edit.on{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
.panel>h2,.sec-title{font-size:17px;margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}
.empty{padding:28px 18px;color:var(--muted);text-align:center}

.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:22px}
.board>div{padding:16px 18px;border-left:1px solid var(--line);min-width:0}
.board>div:first-child{border-left:0}
.board .fig{font-family:var(--cond);font-size:32px;font-weight:600;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board .fig small{font-size:16px;color:var(--muted);font-weight:500;margin-left:3px}
.board .lbl{color:var(--muted);font-size:14px}
.board .sub{font-size:13px;color:var(--muted)}
.board .bad .fig{color:var(--bad)}

.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}

.tablewrap{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;font-size:15px}
table.list th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
table.list td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr:last-child td{border-bottom:0}
table.list tbody tr{cursor:pointer}
table.list tbody tr:hover td{background:var(--surface-2)}
table.list .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.docno{font-family:var(--cond);font-weight:600;font-size:17px;white-space:nowrap;letter-spacing:.01em}
.cust{font-weight:500}
.dim{color:var(--muted);font-size:14px}

.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap}
.b-neutral{background:var(--neutral-soft);color:var(--muted)}
.b-brand{background:var(--brand-soft);color:var(--brand)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.tag{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);padding:1px 7px;border-radius:5px;white-space:nowrap}

.attn{list-style:none;margin:0;padding:0}
.attn li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.attn li:last-child{border-bottom:0}
.attn li:hover{background:var(--surface-2)}
.attn .why{font-size:14px}

.filters{display:flex;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.filters input,.filters select{padding:7px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.filters input{flex:1;min-width:180px}
.filters select{flex:none;width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 12px;font-size:14px;cursor:pointer;font-weight:500}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* forms */
.form{display:grid;gap:22px}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 16px;padding:18px}
.fgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.span2{grid-column:span 2} .fld.span4{grid-column:1/-1}
.fld label{font-size:14px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea{padding:8px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);width:100%}
.fld textarea{resize:vertical;min-height:64px;line-height:1.4}
.fld .hint{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--brand-soft);color:var(--brand)}
table.items{width:100%;border-collapse:collapse}
table.items th{font-size:13px;color:var(--muted);text-align:left;padding:8px 6px;font-weight:600;border-bottom:1px solid var(--line)}
table.items td{padding:6px;vertical-align:top;border-bottom:1px solid var(--line)}
table.items input,table.items textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table.items textarea{resize:vertical;min-height:38px;line-height:1.35}
table.items .n{text-align:right}
input.numlock{background:var(--surface-2)!important;border-color:transparent!important;font-weight:700;cursor:default}
input.numlock:focus{box-shadow:none!important;outline:none}
/* editor: chosen customer summary */
.ccard{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2);gap:2px!important;font-size:14.5px;line-height:1.45}
.ccard .cc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:2px}
.ccard .cc-lab{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);font-weight:700}
.ccard b{font-size:16px}
#c-card[hidden],#c-fields[hidden],#c-donewrap[hidden]{display:none!important}
/* editor: terms locked until Edit */
textarea.lockta{background:var(--surface-2)!important;border-color:transparent!important;resize:none;cursor:default;color:var(--ink)}
textarea.lockta:focus{box-shadow:none!important;outline:none}
/* products: category tabs, chips and row actions */
.ptabs{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 12px}
.ptabs.mini{padding:0;margin:8px 0}
.ptab{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.ptab small{color:var(--muted);font-weight:600;margin-left:2px}
.ptab.on{background:var(--brand);border-color:var(--brand);color:#fff}.ptab.on small{color:#fff;opacity:.8}
.ptab.add{border-style:dashed;color:var(--brand)}
.pcat{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.pdot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.pacts{display:flex;gap:6px;justify-content:flex-end}
.ia{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:14px;cursor:pointer}
.ia:hover{color:var(--brand);border-color:var(--brand)}
table.list.prods .p-used{font-size:13px}
table.list.prods .p-sel{width:34px;cursor:pointer}
table.list.prods .p-sel input{width:17px;height:17px;cursor:pointer;accent-color:var(--brand);margin:0;vertical-align:middle}
table.list.prods tr.picked,table.list.prods tr.picked td{background:var(--brand-soft)}
.pbulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 18px 12px;padding:8px 12px;border-radius:12px;background:var(--brand);color:#fff;font-size:14px}
.pbulk b{margin-right:4px}
.pbulk .btn{background:var(--surface);color:var(--ink);border-color:transparent}
.pbulk .btn.danger{color:var(--bad)}
.pbulk .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.pmenu{position:absolute;z-index:95;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:4px;min-width:170px;display:grid}
.pmenu button{border:0;background:none;text-align:left;padding:9px 12px;border-radius:6px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.pmenu button:hover,.pmenu button:focus{background:var(--brand-soft);outline:none}
.pmenu button.danger{color:var(--bad)}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.pchip.on{background:var(--c,var(--brand));border-color:var(--c,var(--brand));color:#fff}
.pchip.add{border-style:dashed;color:var(--brand)}
.pcl{display:grid;gap:8px}
/* island picker (From / Stops / To on boat trips) */
.ipop{position:absolute;z-index:90;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.2);max-height:min(460px,70vh);display:flex;flex-direction:column;overflow:hidden;font-size:14px}
.ipop .ip-list{overflow:auto;padding:4px;flex:1;min-height:0;position:relative}
.ipop .ip-list .opt,.ipop .ip-list .grp{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 10px;border-radius:6px;cursor:pointer}
.ipop .ip-list .opt:hover,.ipop .ip-list .act{background:var(--brand-soft)}
.ipop .ip-list .grp{font-weight:600}
.ipop .ip-list .grp.on{color:var(--brand)}
.ipop .ip-list .grp .chev{font-style:normal;color:var(--muted);margin-left:6px;font-size:12px}
.ipop .ip-list .kids{margin:0 0 4px 12px;padding-left:6px;border-left:2px solid var(--brand-soft)}
.ipop .ip-list .opt small{font-size:11.5px}
.ipop.pdrop .opt.prod .pn{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.ipop.pdrop .opt.prod small{white-space:nowrap}
.ipop.pdrop .pcat{font-size:10.5px;padding:1px 7px}
.ipop.pdrop .opt.prod{justify-content:flex-start}
.ipop.pdrop .opt.prod small{margin-left:auto}
.ipop.pdrop .ck{flex:none;width:20px;height:20px;border:1.5px solid var(--line);border-radius:5px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background:var(--surface);cursor:pointer}
.ipop.pdrop .ck:hover{border-color:var(--brand)}
.ipop.pdrop .opt.on .ck{background:var(--brand);border-color:var(--brand)}
.ipop.pdrop .opt.on{background:var(--brand-soft)}
.ipop .ip-list .new,.ipop .ip-list .add{color:var(--brand);font-weight:600}
.ipop .ip-list .addto{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:4px 10px 8px;font-size:12.5px}
.ipop .ip-list .addto .chip{border:1px solid var(--brand);color:var(--brand);border-radius:999px;padding:2px 9px;font-weight:600;cursor:pointer}
.ipop .ip-list .addto .chip:hover,.ipop .ip-list .addto .chip.act{background:var(--brand);color:#fff}
.ipop .ip-list .del{margin-left:auto;padding:0 6px;font-size:18px;line-height:1;color:var(--muted)}
.ipop .ip-list .del:hover{color:var(--bad)}
.ipop .cnt{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--brand);color:#fff;font-size:11px;display:inline-grid;place-items:center}
.ipop .ip-hint{padding:6px 10px 2px;font-size:11.5px}
.ipop .ord{display:inline-flex;gap:3px}
.ipop .ord b,.ipop .ip-h .s b{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--brand);color:#fff;font-size:11px;display:inline-grid;place-items:center}
.ipop .ip-h{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px 6px;font-size:13px}
.ipop .ip-h .s{display:inline-flex;align-items:center;gap:5px;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:2px 9px 2px 3px;font-weight:600}
.ipop .ip-act{display:flex;gap:6px;padding:7px 8px;border-top:1px solid var(--line);justify-content:flex-end}
.ipop .ip-act button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
.ipop .ip-act button:disabled{opacity:.45;cursor:default}
.ipop .ip-act button.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
table.items .whenbox{position:relative;display:flex}
table.items .whenbox input[data-k="when"]{padding-right:34px}
table.items .whenbox .cal{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:6px;background:none;color:var(--brand);display:grid;place-items:center;cursor:pointer}
table.items .whenbox .cal:hover{background:var(--brand-soft)}
table.items .whenbox .cal svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
table.items .whenbox .calpick{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
table.items .ret{display:inline-flex;align-items:center;margin-top:5px;padding:3px 8px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap}
table.items .ret.on{background:var(--brand-soft);color:var(--brand);border-color:var(--brand);font-weight:600}
table.items .amt{padding-top:13px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:8px 6px}
.x:hover{color:var(--bad)}
.totals{display:grid;grid-template-columns:auto auto;gap:6px 22px;justify-content:end;padding:14px 18px;font-variant-numeric:tabular-nums}
.totals .gt{font-family:var(--cond);font-size:24px;font-weight:700}
.totals span:nth-child(odd){color:var(--muted);text-align:right}
.totals span:nth-child(even){text-align:right}
.words{padding:0 18px 16px;color:var(--muted);font-size:14px;text-align:right}
.stickybar{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* type picker */
.kindpick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kindpick button{display:flex;flex-direction:column;gap:3px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.kindpick button b{font-size:17px}
.kindpick button>span{color:var(--muted);font-size:14px}
.kindpick button:hover{border-color:var(--muted)}
.kindpick button.on{border:2px solid var(--brand);padding:13px 15px;background:var(--brand-soft)}
.kindpick button.on b{color:var(--brand)}
@media (max-width:600px){.kindpick{grid-template-columns:minmax(0,1fr)}}
/* doc view */
.docview{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.sheet-fit{width:100%;overflow:hidden;border-radius:4px;box-shadow:0 1px 2px rgba(20,30,40,.08),0 8px 28px rgba(20,30,40,.10)}
.facts{padding:16px 18px;display:grid;gap:10px}
.facts .k{font-size:13px;color:var(--muted)}
.facts .v{font-weight:600}
.facts .big{font-family:var(--cond);font-size:30px;font-weight:700;line-height:1.1}
.acts{display:flex;flex-direction:column;gap:6px;padding:0 18px 18px}
.acts .btn{justify-content:flex-start}
.plist{list-style:none;margin:0;padding:0}
.plist li{padding:10px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;font-size:14px}
.links a{display:block;padding:10px 18px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14px}
.links a:hover{background:var(--surface-2)}
.sidecol{display:grid;gap:16px;position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:12px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0;padding:16px 20px;border-bottom:1px solid var(--line);font-size:18px}
.modal .mb{padding:18px 20px;display:grid;gap:14px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:8px;font-weight:500;z-index:60;max-width:90vw}
.loading{padding:80px 0;text-align:center;color:var(--muted)}

/* ===== The printed document ===== */
.sheet{width:794px;min-height:1123px;background:#fff;color:#1b1b1b;font-family:var(--serif);font-size:13.5px;line-height:1.45;padding:46px 54px 40px;position:relative;display:flex;flex-direction:column}
.sheet .hd{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
.sheet .co{display:flex;gap:14px;align-items:flex-start}
.sheet .co img{width:104px;height:auto}
.sheet .co b{font-size:15px;letter-spacing:.02em}
.sheet .co div{font-size:12.5px;color:#333}
.sheet .ttl{text-align:right}
.sheet .ttl h1{margin:0 0 10px;font-size:30px;font-weight:700;color:#33669b;letter-spacing:.02em}
.sheet .meta{border-collapse:collapse;margin-left:auto;font-size:13px}
.sheet .meta td{padding:1px 0 1px 12px;text-align:right}
.sheet .meta td:first-child{color:#555}
.sheet .meta td:last-child{font-weight:600;white-space:nowrap}
.sheet .parties{display:flex;justify-content:space-between;gap:24px;margin-top:28px}
.sheet .parties .lab{font-size:12px;font-weight:700;color:#33669b;letter-spacing:.04em;margin-bottom:4px}
.sheet .parties .nm{font-weight:700;font-size:14.5px}
.sheet .project{margin-top:30px;font-weight:700}
.sheet table.it{width:100%;border-collapse:collapse;margin-top:16px}
.sheet table.it th{background:#33669b;color:#fff;font-weight:700;text-align:left;padding:7px 10px;font-size:13px}
.sheet table.it td{padding:8px 10px;border-bottom:1px solid #dde3ea;vertical-align:top}
.sheet table.it tr:nth-child(even) td{background:#f5f8fb}
.sheet table.it .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.sheet table.it .c{text-align:center;white-space:nowrap}
.sheet table.it tr.fill td{height:var(--fill,0px);background:none;border-bottom:1px solid #dde3ea}
.sheet .itbox{flex:1;display:flex;flex-direction:column;min-height:0}
.sheet .itfill{flex:1;min-height:24px;border-bottom:1px solid #dde3ea}
.sheet .botrow{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;margin-top:16px}
.sheet .botrow .bank{margin-top:0}
.sheet .auth{width:230px;text-align:center;font-size:12.5px;flex:none}
.sheet .auth .for{font-weight:700;font-size:12px;letter-spacing:.02em}
.sheet .auth .sl{height:64px;border-bottom:1px solid #9aa3ad;position:relative}
.sheet .auth .sl img{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);mix-blend-mode:multiply;max-width:92%;width:auto;height:auto}
.sheet .auth .cap{color:#555;margin-top:4px}
.sheet .auth .nm{font-weight:600}
.sheet .sum{display:flex;justify-content:space-between;gap:24px;margin-top:10px;align-items:flex-start}
.sheet .sum .w{font-size:12.5px;padding-top:32px;max-width:440px}
.sheet .sum table{border-collapse:collapse;min-width:250px}
.sheet .sum td{padding:5px 10px;text-align:right;font-variant-numeric:tabular-nums}
.sheet .sum td:first-child{font-weight:700}
.sheet .sum tr.gt td{background:#33669b;color:#fff;font-weight:700;font-size:14.5px}
.sheet .sum tr.bal td{color:#8a2a20}
.sheet .terms{margin-top:26px;font-size:12.5px}
.sheet .terms b{display:inline-block;margin-bottom:7px;font-size:13px;color:#33669b;letter-spacing:.02em;padding-bottom:3px;border-bottom:2px solid #33669b}
.sheet .terms p{margin:0 0 4px;border-left:1.5px solid #c9d6e5;padding-left:13.5px}
.sheet .bank{margin-top:16px;font-size:12.5px;border-left:3px solid #33669b;padding:3px 0 3px 12px;display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:1px;width:fit-content}
.sheet .bank b{grid-column:1/-1;margin-bottom:3px;font-size:13px;color:#33669b;letter-spacing:.02em}
.sheet .bank span{color:#555}
.sheet .msg{margin-top:22px;font-size:13px}
.sheet .msg p{margin:0 0 8px}
.sheet .signs{display:flex;justify-content:space-between;gap:40px;margin-top:30px;font-size:13px}
.sheet .signs>div{flex:1;max-width:280px}
.sheet .signs .ln{display:flex;gap:8px;margin-top:8px;min-height:22px;align-items:flex-end}
.sheet .signs .ln>span:first-child{width:46px;color:#555;flex:none}
.sheet .signs .ln>span:last-child{flex:1;border-bottom:1px dotted #999;min-height:20px;padding-left:4px}
.sheet .signs .ln.sg{height:78px;margin-top:0}
.sheet .signs .ln.sg>span:last-child{position:relative;height:100%}
.sheet .signs .ln.sg img{mix-blend-mode:multiply;position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);max-height:calc(60px * var(--sc,1));max-width:92%;width:auto;height:auto}
.sheet .foot{margin-top:auto;padding-top:22px;text-align:center}
.sheet .foot b{display:block;font-size:13.5px;color:#33669b;letter-spacing:.04em;margin-bottom:8px}
.sheet .foot .bar{display:flex;height:4px;margin-bottom:10px}
.sheet .foot .bar i{flex:1;background:#333}
.sheet .foot .bar i+i{background:#2f7fc1}
.sheet .foot .q{font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#333;margin-bottom:6px}
.sheet .foot .ct{display:flex;justify-content:center;align-items:center;gap:44px;font-size:14px;font-weight:700;color:#333}
.sheet .foot .ct span{display:inline-flex;align-items:center;gap:10px}
.sheet .foot .ct svg{width:28px;height:28px;flex:none}
.sheet .sum{position:relative}
.sheet .hire .hdesc{font-weight:600}
.sheet .hire .route{display:flex;align-items:flex-start;gap:10px;margin-top:6px}
/* route map: islands on a line, dots filled at FROM / TO, open at stops, orange dashed leg for the return */
.sheet .hire .map{display:flex;flex-wrap:wrap;row-gap:8px;min-width:0}
.sheet .hire .map.wide{min-width:calc(100% - 125px)}   /* short routes: the last dot reaches the middle of the page */
.sheet .hire .map .lnk{flex:1 1 0;min-width:0;height:2px;margin-top:19.5px;background:#33669b}
.sheet .hire .map .lnk.ret{background:repeating-linear-gradient(90deg,#d0782f 0 5px,transparent 5px 9px)}
.sheet .hire .stn{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:70px;padding:0 8px;position:relative;line-height:1.2}
.sheet .hire .stn small{display:block;height:12px;font-size:9.5px;letter-spacing:.08em;color:#33669b;font-weight:700}
.sheet .hire .stn i{width:11px;height:11px;margin:3px 0 4px;border-radius:50%;border:2px solid #33669b;background:#fff;box-sizing:border-box;position:relative;z-index:1}
.sheet .hire .stn.end i{background:#33669b}
.sheet .hire .stn b{font-size:13px;font-weight:600;max-width:112px;overflow-wrap:break-word}
.sheet .hire .stn::before,.sheet .hire .stn::after{content:"";position:absolute;top:19.5px;height:2px;background:#33669b}
.sheet .hire .stn::before{left:0;right:50%}.sheet .hire .stn::after{left:50%;right:0}
.sheet .hire .stn:first-child::before,.sheet .hire .stn:last-child::after{display:none}
.sheet .hire .stn.ret small{color:#d0782f}.sheet .hire .stn.ret i{border-color:#d0782f}
.sheet .hire .stn.ret::before,.sheet .hire .stn.toret::after{background:repeating-linear-gradient(90deg,#d0782f 0 5px,transparent 5px 9px)}
.sheet .hire .when{display:inline-flex;flex-direction:column;line-height:1.2;margin-left:auto;padding-left:14px;border-left:1px solid #dde3ea}
.sheet .hire .when small{font-size:9.5px;letter-spacing:.08em;color:#33669b;font-weight:700}
.sheet .hire .when b{font-size:13px;font-weight:600;margin-top:3px}
.sheet .stamp{position:absolute;width:190px;right:6px;top:62px;pointer-events:none}
.sheet .void{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:700 110px/1 var(--serif);color:rgba(178,55,44,.14);transform:rotate(-24deg);letter-spacing:.08em}
.sheet [lang="dv"],.sheet .dv{font-family:"Faruma","Noto Sans Thaana",var(--serif)}

@media (max-width:1100px){
  .board{grid-template-columns:repeat(3,minmax(0,1fr))}
  .board>div:nth-child(4){border-left:0}
  .board>div:nth-child(n+4){border-top:1px solid var(--line)}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .docview{grid-template-columns:minmax(0,1fr)}
  .sidecol{position:static;grid-row:1}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:10px;z-index:20;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px))}
  .brand b,.brand small,.side h6,.quick,.sync span{display:none}
  .brand .tile{width:42px;height:36px}
  .nav{flex-direction:row;gap:2px}
  .nav a{padding:7px 10px;white-space:nowrap;font-size:15px}
  .sync{margin:0;padding:0}
  main{padding:20px 14px 60px}
  .pagehead h1{font-size:28px}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board>div{border-left:0!important;border-top:1px solid var(--line)}
  .board>div:nth-child(-n+2){border-top:0}
  .board>div:nth-child(even){border-left:1px solid var(--line)!important}
  .fgrid{grid-template-columns:repeat(2,minmax(0,1fr));padding:14px}
  .fgrid.two{grid-template-columns:minmax(0,1fr)}
}
/* item lines stay on one row; only very small phones stack them */
table.items{table-layout:fixed}
table.items td.d{min-width:0}
@media (max-width:860px){
  table.items th,table.items td{padding-left:3px;padding-right:3px}
  table.items input,table.items textarea{padding:7px 7px}
}
@media (max-width:520px){
  table.items thead{display:none}
  table.items tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(72px,auto) 28px;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
  table.items td{border:0;padding:0}
  table.items td.d{grid-column:1/-1;min-width:0}
  table.items td.amt{padding-top:0}
  table.items .x{padding:4px}
  /* boat trips on phones: description / from + to / stops / date + amount */
  table.items tr.trip{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 28px;align-items:start}
  table.items tr.trip td:nth-child(2){grid-column:1}
  table.items tr.trip td:nth-child(3){grid-column:1/-1;order:1}
  table.items tr.trip td:nth-child(4){grid-column:2/-1}
  table.items tr.trip td:nth-child(n+5){order:2}
  table.items tr.trip td:nth-child(5){grid-column:1}
  table.items tr.trip td:nth-child(6){grid-column:2}
  table.items tr.trip td:nth-child(4){display:flex;flex-direction:column;align-items:flex-start}
}
/* ===== Layout & look: light shell, slim icon menu, rounded workspace ===== */
body{background:var(--shell)}
.app{grid-template-columns:104px minmax(0,1fr);grid-template-rows:auto 1fr;background:var(--shell)}
.top{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 28px 14px 22px;position:sticky;top:0;z-index:30;background:var(--shell)}
.top .brand{display:flex;flex-direction:row;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.top .brand .tile{width:58px;height:46px;padding:4px 5px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center}
.top .brand .tile img{width:100%;height:100%;object-fit:contain}
.top .brand b{display:block;font-size:18px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.top .brand small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.tools{display:flex;align-items:center;gap:10px}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:0;background:transparent;color:var(--ink);cursor:pointer;position:relative;text-decoration:none;list-style:none}
.ibtn::-webkit-details-marker{display:none}
.ibtn:hover{background:var(--surface)}
.ibtn.primary{background:var(--brand);color:var(--brand-ink);box-shadow:0 4px 12px rgba(47,97,153,.35)}
.ibtn.primary:hover{background:var(--brand-2)}
.ibtn .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:#e8590c;border:2px solid var(--shell)}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#18324f);color:#fff;font-weight:700;display:grid;place-items:center;cursor:pointer;list-style:none;font-size:15px}
.avatar::-webkit-details-marker{display:none}
.menu{position:relative}
.menu summary{list-style:none}
.menu .pop{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(16,24,40,.14);padding:8px;min-width:230px;display:grid;gap:2px;z-index:40}
.menu .pop a,.menu .pop button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;border:0;background:none;cursor:pointer;text-align:left;width:100%}
.menu .pop a:hover,.menu .pop button:hover{background:var(--surface-2)}
.menu .pop svg{color:var(--brand)}
.menu .pop .who{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.menu .pop .who b{display:block;color:var(--ink);font-size:14px}
.menu .pop .who i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)}
.menu .pop .who i.cloud{background:var(--ok)} .menu .pop .who i.local{background:var(--warn)}
.menu .pop .thm{padding:6px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .pop .thm>span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.menu .pop .thm .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;border:0}
.menu .pop .thm .seg button{justify-content:center;gap:6px;padding:7px 6px;border-radius:9px;font-size:13px;color:var(--muted)}
.menu .pop .thm .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(16,24,40,.12)}
.menu .pop .thm .seg svg{color:currentColor}

.side{position:sticky;top:74px;height:calc(100vh - 74px);background:transparent;border:0;padding:8px 12px 20px;gap:6px;align-items:center;color:var(--muted)}
.side h6{margin:6px 0 8px;font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.nav{gap:6px;width:100%}
.nav a{flex-direction:column;justify-content:center;gap:4px;padding:10px 4px;border-radius:16px;color:var(--muted);font-size:11.5px;font-weight:600;text-align:center;position:relative;transition:background .15s,color .15s}
.nav a svg{width:22px;height:22px}
.nav a:hover{background:var(--surface);color:var(--ink)}
.nav a.on{background:var(--surface);color:var(--brand);box-shadow:0 2px 8px rgba(16,24,40,.06);font-weight:700}
.nav a .s{display:none}
.nav .cnt{position:absolute;top:5px;right:14px;min-width:18px;height:18px;padding:0 5px;font-size:11px;line-height:18px;border-radius:9px;background:var(--brand);color:#fff}
.nav .cnt.hot{background:#e8590c;color:#fff}

main{background:var(--surface);border-radius:28px 0 0 0;padding:32px 36px 60px;min-height:calc(100vh - 74px);border:1px solid var(--line);border-right:0;border-bottom:0}
.pagehead{align-items:center;margin-bottom:26px}
.pagehead h1{font-family:var(--ui);font-size:30px;font-weight:800;letter-spacing:-.02em}
.pagehead p{font-size:15px}

.btn{border-radius:999px;padding:9px 18px;font-weight:600;font-size:14.5px;border-color:var(--line);transition:background .15s,border-color .15s}
.btn:hover{border-color:#c5ccd6;background:var(--surface-2)}
.btn.primary{box-shadow:0 4px 12px rgba(47,97,153,.28)}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.tg svg{color:#229ED9}
.m-only{display:none}
.stamptog{display:flex;align-items:center;gap:8px;margin:0 18px 14px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;user-select:none}
.stamptog .ic{color:var(--muted);display:grid}
.stamptog span:nth-child(2){flex:1}
.stamptog input{position:absolute;opacity:0;width:1px;height:1px}
.stamptog .sw{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;transition:background .15s;flex:none}
.stamptog .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.stamptog input:checked+.sw{background:var(--ok)}
.stamptog input:checked+.sw::after{transform:translateX(16px)}
.stamptog:has(input:checked) .ic{color:var(--ok)}
.stamptog input:focus-visible+.sw{outline:2px solid var(--brand);outline-offset:2px}
/* reports & expenses */
:root{--c-sales:#2f6199;--c-exp:#d0782f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c-sales:#4f8fd6;--c-exp:#c97832}}
:root[data-theme="dark"]{--c-sales:#4f8fd6;--c-exp:#c97832}
.tabs{display:inline-flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px;margin-bottom:18px}
.tabs a{padding:7px 16px;border-radius:999px;font-weight:600;font-size:14.5px;color:var(--muted);text-decoration:none}
.tabs a.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(16,24,40,.1)}
.chartwrap{position:relative;padding:8px 18px 14px}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.chartwrap .gl{stroke:var(--line);stroke-width:1}
.chartwrap .ax{fill:var(--muted);font:12px var(--ui)}
.chartwrap .hit{fill:transparent;cursor:default}
.chartwrap .hit:hover,.chartwrap .hit.on{fill:var(--surface-2)}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:12px 18px 0;font-size:13.5px;color:var(--ink)}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .side,.top,.sidecol,.pagehead,.toast,.scrim,.noprint{display:none!important}
  .app{display:block}
  main{padding:0;border:0;border-radius:0;background:#fff;min-height:0}
  .docview{display:block}
  .sheet-fit{height:auto!important;box-shadow:none;border-radius:0;overflow:visible}
  .sheet{transform:none!important;min-height:296mm;width:210mm}
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = s => esc(s).replace(/\n/g,'<br>');
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g,'')); return isFinite(n) ? n : 0; };
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const money = n => (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => (Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:0});
const qfmt = n => (Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:3});
const pad2 = n => String(n).padStart(2,'0');
const isoOf = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayISO = () => isoOf(new Date());
const addDays = (iso, n) => { const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+Number(n||0)); return isoOf(d); };
const daysBetween = (a, b) => Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 864e5);
const fmtDate = iso => iso ? new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) : '';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const clone = o => JSON.parse(JSON.stringify(o));
const hasThaana = s => /[\u0780-\u07BF]/.test(s||'');

function amountWords(n){
  const ones=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  const w = n => {
    if (n < 20) return ones[n];
    if (n < 100) return tens[Math.floor(n/10)] + (n%10 ? ' '+ones[n%10] : '');
    if (n < 1000) return ones[Math.floor(n/100)] + ' hundred' + (n%100 ? ' '+w(n%100) : '');
    for (const [v,name] of [[1e9,'billion'],[1e6,'million'],[1e3,'thousand']])
      if (n >= v) return w(Math.floor(n/v)) + ' ' + name + (n%v ? ' '+w(n%v) : '');
  };
  n = r2(Math.abs(n)); const rf = Math.floor(n), l = Math.round((n-rf)*100);
  let s = rf === 0 ? 'zero' : w(rf);
  return s.charAt(0).toUpperCase() + s.slice(1) + ' rufiyaa & ' + pad2(l) + '/100';
}

const viaList = v => String(v || '').split(/\s*(?:,|;|→|->|–|—|\s-\s|-|\n)\s*/).map(x => x.trim()).filter(Boolean);
// [label, place] for each point of the trip: FROM, the stops, TO, and RETURN (back to the start) on a return trip
const routePts = it => { const via = viaList(it.via), out = [];
  if (it.from) out.push(['FROM', it.from]);
  via.forEach((v, i) => out.push([via.length > 1 ? 'STOP ' + (i + 1) : 'STOP', v]));

  if (it.ret && it.from && out.length > 1) out.push(['RETURN', it.from]);
  return out; };

// A voided document stays on record (numbers are never reused) but no longer counts anywhere.
const isVoid = d => d.status === 'void' || d.status === 'cancelled';
function statusOf(d){
  const t = todayISO();
  if (isVoid(d)) return 'void';
  if (d.type === 'invoice'){
    const tot = total(d), p = paidOf(d);
    if (tot > 0 && p >= tot - 0.005) return 'paid';
    if (addDays(d.date, d.dueDays) < t) return 'overdue';
    return p > 0 ? 'partial' : 'unpaid';
  }
  if (d.type === 'quotation'){
    if (d.status === 'accepted' || d.status === 'rejected') return d.status;
    if (addDays(d.date, d.validDays) < t) return 'expired';
    return d.status || 'draft';
  }
  return d.status === 'delivered' ? 'delivered' : 'pending';
}

function dbErr(e){

async function put(col, id, data){

  const bucket = col === 'docs' ? S.docs : col === 'expenses' ? S.expenses : col === 'places' ? S.places : S.customers;

function subscribe(){
  let waiting = 3; const seen = {};
  const ready = k => { if (!seen[k]){ seen[k] = 1; if (--waiting === 0){ S.ready = true; render(true); } } };
  const fail = k => e => { ready(k); if (e && e.code !== 'revoked') toast('Live updates paused. Reload the page to reconnect.'); };
  db.collection('docs').limit(1000).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(x => m[x.id] = {...x.data(), id:x.id}); S.docs = m; ready('d'); onData();
  }, fail('d'));
  db.collection('customers').limit(1000).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(x => m[x.id] = {...x.data(), id:x.id}); S.customers = m; ready('c'); onData();
  }, fail('c'));
  db.doc('settings/company').onSnapshot(snap => {
    S.settings = {...DEFAULTS, ...(snap.exists ? snap.data() : {})}; ready('s'); onData();
  }, fail('s'));
  // expenses: owner and staff only; a viewer (or rules not yet updated) simply sees none
  if (canEdit()) db.collection('expenses').limit(2000).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(x => m[x.id] = {...x.data(), id:x.id}); S.expenses = m; S.expensesBlocked = false; onData();
  }, e => { S.expensesBlocked = e && e.code === 'invalid_argument'; onData(); });
  // custom trip places (resorts…); until the rules include "places" the list is simply empty
  db.collection('places').limit(1000).onSnapshot(snap => {
    const m = {}; snap.docs.forEach(x => m[x.id] = {...x.data(), id:x.id}); S.places = m;
  }, () => {});
}

function productDrop(box, opts){

  const close = () => { if (pop) pop.remove(); pop = null; inp = null; sel.clear(); };
  const place = () => { const r = inp.getBoundingClientRect(), w = Math.min(Math.max(r.width, 300), innerWidth - 16);

  const draw = kb => {
    const q = inp.value.trim().toLowerCase(), list = products();
    hits = list.filter(p => !q || [p.name, p.unit, (catOf(p) || {}).name].some(x => (x || '').toLowerCase().includes(q))).slice(0, 80);
    if (!sel.size && (!hits.length || (hits.length === 1 && (hits[0].name || '').trim().toLowerCase() === q))){ pop.hidden = true; return; }
    pop.hidden = false; act = Math.min(act, Math.max(hits.length - 1, 0));

    pop.innerHTML = `<div class="ip-hint dim">${n ? 'Tick more, then add them all' : 'Click a product to fill this line · tick ☐ to add several'}</div><div class="ip-list" role="listbox" aria-multiselectable="true">`
      + (hits.length ? hits.map((p, i) => { const c = catOf(p), on = sel.has(p.id), meta = [p.unit, opts.rates && String(p.rate ?? '') !== '' ? 'MVR ' + money(num(p.rate)) : ''].filter(Boolean).join(' · ');
        return `<div class="opt prod${i === act ? ' act' : ''}${on ? ' on' : ''}" role="option" aria-selected="${on}" data-nav data-i="${i}"><span class="ck" data-ck="${i}" title="${on ? 'Untick' : 'Tick to add several'}">${on ? '✓' : ''}</span><span class="pn">${esc(p.name)}${c ? ` <span class="pcat" style="--c:${catColor(c)}">${esc(c.name)}</span>` : ''}</span><small class="dim">${esc(meta)}</small></div>`; }).join('')
        : '<div class="dim" style="padding:10px">No product matches. Clear the text to see all.</div>') + '</div>'
      + (n ? `<div class="ip-act"><span class="dim" style="margin-right:auto;align-self:center;font-size:13px">${n} ticked</span><button type="button" data-a="clear">Clear</button><button type="button" class="pri" data-a="add">Add ${n} product${n === 1 ? '' : 's'}</button></div>` : '');
    place(); pop.querySelector('.ip-list').scrollTop = st;
    if (kb){ const a = pop.querySelector('.act'); if (a) a.scrollIntoView({block:'nearest'}); }
  };

  const addAll = () => { const i = +inp.dataset.i, list = [...sel.values()]; close(); if (list.length) opts.pickMany(i, list); };
  const tick = p => { if (!p) return; sel.has(p.id) ? sel.delete(p.id) : sel.set(p.id, p); draw(); };
  const open = el => {
    if (!products().length) return;
    if (pop && inp === el) return; close(); inp = el; act = 0;
    pop = document.createElement('div'); pop.className = 'ipop pdrop'; document.body.appendChild(pop);

  });
  addEventListener('resize', () => { if (pop && !pop.hidden) place(); });
}

  else if (r.a === 'customers') viewCustomers(main);

/* ---------- dashboard ---------- */
function viewDashboard(main){
  const t = todayISO(), month = t.slice(0,7);
  const inv = docsOf('invoice'), q = docsOf('quotation'), dn = docsOf('delivery');
  const open = inv.filter(d => ['unpaid','partial','overdue'].includes(statusOf(d)));
  const over = open.filter(d => statusOf(d) === 'overdue');
  const openQ = q.filter(d => ['draft','sent'].includes(statusOf(d)));
  const pend = dn.filter(d => statusOf(d) === 'pending');
  const billed = inv.filter(d => !isVoid(d) && (d.date||'').startsWith(month)).reduce((s,d) => s + total(d), 0);
  const collected = inv.reduce((s,d) => s + (d.payments||[]).filter(p => (p.date||'').startsWith(month)).reduce((a,p) => a + num(p.amount), 0), 0);

  const attn = [];

      ${stat('clock', money0(over.reduce((s,d)=>s+balance(d),0)), 'MVR', 'Overdue', `${over.length} invoice${over.length===1?'':'s'}`, over.length ? 'bad' : '')}
      ${stat('file', money0(openQ.reduce((s,d)=>s+total(d),0)), 'MVR', 'Open quotations', `${openQ.length} waiting for a reply`)}
      ${stat('truck', pend.length, '', 'To deliver', `delivery note${pend.length===1?'':'s'} pending`, pend.length ? 'warn' : '')}
      ${stat('calendar', money0(billed), 'MVR', 'Billed this month', `${money0(collected)} collected`, 'ok')}
    </div>
    <div class="grid2">
      <section class="panel"><h2>Needs attention</h2>
        ${attn.length ? `<ul class="attn">${attn.slice(0,10).map(x => `<li data-go="doc/${x.d.id}"><div><div><span class="docno">${esc(x.d.number)}</span> <span class="cust">${esc(x.d.customer?.name)}</span></div><div class="why dim">${esc(x.why)}</div></div>${badge(statusOf(x.d))}</li>`).join('')}</ul>`

const listState = {quotation:{q:'',f:'all'}, invoice:{q:'',f:'all'}, delivery:{q:'',f:'all'}};
function listStats(type){
  const t = todayISO(), month = t.slice(0,7), ds = docsOf(type);
  if (type === 'invoice'){
    const live = ds.filter(d => !isVoid(d));
    const open = live.filter(d => ['unpaid','partial','overdue'].includes(statusOf(d))), over = open.filter(d => statusOf(d) === 'overdue');
    const got = live.reduce((s,d) => s + (d.payments||[]).filter(p => (p.date||'').startsWith(month)).reduce((a,p) => a + num(p.amount), 0), 0);
    const paid = live.filter(d => statusOf(d) === 'paid' && (d.payments||[]).length);
    const avg = paid.length ? Math.round(paid.reduce((s,d) => s + Math.max(0, daysBetween(d.date, d.payments.map(p => p.date||d.date).sort().pop())), 0) / paid.length) : null;
    return stat('clock', money0(over.reduce((s,d)=>s+balance(d),0)), 'MVR', 'Overdue amount', `${over.length} invoice${over.length===1?'':'s'}`, over.length ? 'bad' : '')
      + stat('wallet', money0(open.reduce((s,d)=>s+balance(d),0)), 'MVR', 'Unpaid totals', `${open.length} invoice${open.length===1?'':'s'}`)
      + stat('check', money0(got), 'MVR', 'Collected this month', '', 'ok')
      + stat('hourglass', avg == null ? '–' : avg, avg == null ? '' : `day${avg===1?'':'s'}`, 'Average paid time', `${paid.length} paid invoice${paid.length===1?'':'s'}`, 'warn');
  }
  if (type === 'quotation'){
    const open = ds.filter(d => ['draft','sent'].includes(statusOf(d))), acc = ds.filter(d => statusOf(d) === 'accepted');
    const soon = open.filter(d => daysBetween(t, addDays(d.date, d.validDays)) <= 5);
    const decided = ds.filter(d => ['accepted','rejected','expired'].includes(statusOf(d))).length;
    return stat('file', money0(open.reduce((s,d)=>s+total(d),0)), 'MVR', 'Open quotations', `${open.length} waiting for a reply`)
      + stat('check', money0(acc.reduce((s,d)=>s+total(d),0)), 'MVR', 'Accepted', `${acc.length} quotation${acc.length===1?'':'s'}`, 'ok')
      + stat('hourglass', soon.length, '', 'Expiring soon', 'within 5 days', soon.length ? 'warn' : '')
      + stat('calendar', decided ? Math.round(acc.length / decided * 100) + '%' : '–', '', 'Win rate', `${decided} decided`);
  }
  const pend = ds.filter(d => statusOf(d) === 'pending'), done = ds.filter(d => statusOf(d) === 'delivered' && (d.date||'').startsWith(month));
  return stat('truck', pend.length, '', 'To deliver', `delivery note${pend.length===1?'':'s'} pending`, pend.length ? 'warn' : '')
    + stat('check', done.length, '', 'Delivered this month', '', 'ok')
    + stat('box', qfmt(pend.reduce((s,d)=>s+qtyTotal(d),0)), '', 'Quantity to deliver', 'across pending notes');
}

/* ---------- quick status change from the lists ---------- */
function statusMenu(btn){
  if (!canEdit()) return;
  const old = document.querySelector('.stmenu'); if (old){ const same = old.dataset.for === btn.dataset.stm; old._close(); if (same) return; }
  const d = S.docs[btn.dataset.stm]; if (!d) return;
  const st = statusOf(d), items = [];
  const it = (act, label, on, tone) => items.push(`<button type="button" role="menuitem" data-sa="${act}" class="${on ? 'on' : ''}" ${on ? 'aria-current="true"' : ''}><i class="b-${tone}"></i>${label}${on ? '<span class="ck">✓</span>' : ''}</button>`);
  if (st === 'void'){
    items.push(`<div class="note">Voided${d.voided?.date ? ' on ' + fmtDate(d.voided.date) : ''}${d.voided?.reason ? ': ' + esc(d.voided.reason) : ''}. It stays on record but doesn't count in totals.</div>`);
    if (isOwnerRole()) it('unvoid', 'Restore', false, 'brand');
  } else if (d.type === 'quotation'){
    it('draft', 'Draft', d.status === 'draft' || !d.status, 'neutral'); it('sent', 'Sent', d.status === 'sent', 'brand');
    it('accepted', 'Accepted', st === 'accepted', 'ok'); it('rejected', 'Rejected', st === 'rejected', 'bad');
    if (st === 'expired') items.push('<div class="note">Past its valid-until date, so it shows as Expired until accepted or rejected.</div>');
    if (isOwnerRole()) it('void', 'Void…', false, 'neutral');
  } else if (d.type === 'invoice'){
    if (st !== 'paid'){ it('paidFull', `Mark as paid (MVR ${money(balance(d))})`, false, 'ok'); it('pay', 'Record a payment…', false, 'warn'); }
    else items.push(`<div class="note">Paid in full. Remove payments on the invoice page to reopen it.</div>`);
    if (isOwnerRole()) it('void', 'Void…', false, 'neutral');
  } else {
    it('deliver', st === 'delivered' ? 'Delivered – edit details…' : 'Mark as delivered…', st === 'delivered', 'ok');
    it('undeliver', 'To deliver', st === 'pending', 'warn');
    if (isOwnerRole()) it('void', 'Void…', false, 'neutral');
  }
  const m = document.createElement('div'); m.className = 'stmenu'; m.setAttribute('role', 'menu'); m.dataset.for = d.id;
  m.innerHTML = `<div class="hd">${esc(d.number)}</div>${items.join('')}`;
  document.body.appendChild(m);
  const r = btn.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(innerWidth - mw - 8, r.right - mw)) + 'px';
  m.style.top = (r.bottom + mh + 8 > innerHeight ? Math.max(8, r.top - mh - 6) : r.bottom + 6) + 'px';
  const close = () => { m.remove(); document.removeEventListener('mousedown', out, true); document.removeEventListener('touchstart', out, true); document.removeEventListener('keydown', key); window.removeEventListener('scroll', onScroll); };
  const y0 = window.scrollY, onScroll = () => { if (Math.abs(window.scrollY - y0) > 40) close(); };
  const out = e => { if (!m.contains(e.target) && !btn.contains(e.target)) close(); };
  const key = e => { if (e.key === 'Escape') close(); };
  m._close = close;
  document.addEventListener('mousedown', out, true); document.addEventListener('touchstart', out, {capture:true, passive:true}); document.addEventListener('keydown', key); window.addEventListener('scroll', onScroll, {passive:true});
  m.addEventListener('click', e => {
    const b = e.target.closest('[data-sa]'); if (!b) return; close();
    const a = b.dataset.sa;
    if (b.classList.contains('on') && a !== 'deliver') return;
    if (a === 'draft') setStatus(d, 'draft', 'Marked as draft');
    else if (a === 'undeliver') docAction(d, 'undeliver');
    else if (a === 'paidFull'){
      const amt = r2(balance(d)); if (amt <= 0) return;
      put('docs', d.id, {...clone(d), payments:[...(d.payments || []), {amount:amt, date:todayISO(), method:'Other', ref:'Marked as paid from the list'}], updatedAt:new Date().toISOString()}).then(() => toast(`${d.number} marked as paid`));
    }
    else docAction(d, a);
  });
  (m.querySelector('[data-sa]:not(.on)') || m.querySelector('[data-sa]'))?.focus({preventScroll:true});
}

/* ---------- customer statement ---------- */
function statementData(c){
  const inv = Object.values(S.docs).filter(d => d.type === 'invoice' && d.customerId === c.id && !isVoid(d)).sort((a,b) => (a.date||'').localeCompare(b.date||'') || (a.number||'').localeCompare(b.number||''));
  const rows = [];
  inv.forEach(d => {
    rows.push({date:d.date, ref:d.number, what:'Invoice' + (d.project ? ' · ' + d.project : ''), debit:total(d), credit:0, o:0});
    (d.payments || []).forEach(p => rows.push({date:p.date || d.date, ref:d.number, what:'Payment received' + (p.method ? ' · ' + p.method : '') + (p.ref ? ' · ' + p.ref : ''), debit:0, credit:num(p.amount), o:1}));
  });
  rows.sort((a,b) => (a.date||'').localeCompare(b.date||'') || a.o - b.o);
  let bal = 0; rows.forEach(r => { bal = r2(bal + r.debit - r.credit); r.bal = bal; });
  const billed = r2(inv.reduce((s,d) => s + total(d), 0)), paid = r2(inv.reduce((s,d) => s + paidOf(d), 0));
  const open = inv.filter(d => balance(d) > 0.005);
  return {inv, rows, billed, paid, due: r2(billed - paid), open};
}
function drawStatement(pdf, c){
  const k = pdfKit(pdf), {BLUE, INK, GREY, LINE, ZEBRA, WHITE, L, R, CW, BOTTOM, font, lh, txt, wrap} = k;
  const t = todayISO(), sd = statementData(c);
  let y = pdfHeader(pdf, k, 'STATEMENT', [['Statement date:', fmtDate(t)], ['Period:', sd.rows.length ? `${fmtDate(sd.rows[0].date)} – ${fmtDate(t)}` : '-'], ['Invoices:', String(sd.inv.length)]]);
  font(8.6, true, BLUE); pdf.text('STATEMENT FOR', L, y); y += lh(9.5);
  font(10.8, true); wrap(c.name, 110).forEach(l => { txt(l, L, y); y += lh(10.8); });

const monthName = key => new Date(key + '-01T00:00:00').toLocaleDateString('en-GB', {month:'short', year:'2-digit'});
const compact = n => { const a = Math.abs(n); return a >= 1e6 ? (n/1e6).toFixed(a >= 1e7 ? 0 : 1).replace(/\.0$/,'') + 'M' : a >= 1e3 ? (n/1e3).toFixed(a >= 1e4 ? 0 : 1).replace(/\.0$/,'') + 'k' : String(Math.round(n)); };
function periodMonths(p){
  const now = new Date(), out = [];
  if (p === 'ty' || p === 'ly'){ const y = now.getFullYear() - (p === 'ly' ? 1 : 0), last = p === 'ly' ? 11 : now.getMonth(); for (let m = 0; m <= last; m++) out.push(`${y}-${pad2(m+1)}`); }
  else for (let i = 11; i >= 0; i--){ const d = new Date(now.getFullYear(), now.getMonth() - i, 1); out.push(`${d.getFullYear()}-${pad2(d.getMonth()+1)}`); }
  return out;
}

/* ---------- quick preview ---------- */
function previewDoc(id, ids){
  ids = ids && ids.length ? ids : [id];
  let i = Math.max(0, ids.indexOf(id));
  const w = document.createElement('div'); w.className = 'scrim pvscrim';
  w.innerHTML = `<div class="pv" role="dialog" aria-modal="true" aria-label="Quick preview">
    <div class="pvhead"><div class="pvtitle"></div>
      <div class="row pvnav"><button type="button" class="ibtn" data-step="-1" title="Previous (←)" aria-label="Previous document">‹</button><span class="dim pvcount"></span><button type="button" class="ibtn" data-step="1" title="Next (→)" aria-label="Next document">›</button><button type="button" class="ibtn" data-close title="Close (Esc)" aria-label="Close">×</button></div></div>
    <div class="pvbody"><div class="sheet-fit"></div></div>
    <div class="pvfoot row"><a class="btn" data-open>Open</a><a class="btn" data-edit data-need="edit">Edit</a><button type="button" class="btn" data-em>${icon('mail',17)}Email</button><button type="button" class="btn tg" data-tg>${icon('send',17)}Telegram</button><button type="button" class="btn primary" data-pdf>Download PDF</button></div></div>`;
  document.body.appendChild(w);
  const show = () => {
    const d = S.docs[ids[i]]; if (!d) return close();
    w.querySelector('.pvtitle').innerHTML = `<b>${esc(d.number)}</b>${badge(statusOf(d))}<div class="dim">${esc(d.customer?.name || '')}${d.type === 'delivery' ? '' : ' · MVR ' + money(total(d))}</div>`;
    w.querySelector('.pvcount').textContent = ids.length > 1 ? `${i + 1} of ${ids.length}` : '';
    w.querySelectorAll('[data-step]').forEach(b => b.hidden = ids.length < 2);
    w.querySelector('[data-step="-1"]').disabled = i === 0; w.querySelector('[data-step="1"]').disabled = i === ids.length - 1;
    w.querySelector('[data-open]').href = '#/doc/' + d.id; w.querySelector('[data-edit]').href = '#/edit/' + d.id;
    w.querySelector('.sheet-fit').innerHTML = sheetHTML(d); fitSheets(); w.querySelector('.pvbody').scrollTop = 0;
  };
  const close = () => { w.remove(); document.removeEventListener('keydown', key, true); onData(); };
  const step = n => { const j = i + n; if (j >= 0 && j < ids.length){ i = j; show(); } };
  const key = e => { if (!['Escape','ArrowLeft','ArrowRight'].includes(e.key)) return; e.stopPropagation(); if (e.key === 'Escape') close(); else step(e.key === 'ArrowLeft' ? -1 : 1); };
  document.addEventListener('keydown', key, true);   // capture, so Esc closes only the preview
  w.addEventListener('click', e => {
    if (e.target === w || e.target.closest('[data-close]')) return close();
    const st = e.target.closest('[data-step]'); if (st) return step(+st.dataset.step);
    if (e.target.closest('[data-open],[data-edit]')){ document.querySelectorAll('.scrim').forEach(x => x !== w && x.remove()); return close(); }
    const d = S.docs[ids[i]];
    if (e.target.closest('[data-pdf]')) makePDF(d, e.target.closest('[data-pdf]'));
    else if (e.target.closest('[data-tg]')) shareTelegram(d, e.target.closest('[data-tg]'));
    else if (e.target.closest('[data-em]')) emailDoc(d, e.target.closest('[data-em]'));
  });
  // swipe left / right on phones
  let sx = null; const body = w.querySelector('.pvbody');
  body.addEventListener('touchstart', e => { sx = e.touches.length === 1 ? e.touches[0].clientX : null; }, {passive:true});
  body.addEventListener('touchend', e => { if (sx == null) return; const dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 70) step(dx < 0 ? 1 : -1); });
  show(); w.querySelector('[data-close]').focus();
}

/* ---------- drafts ---------- */
// Keep the number of days in the terms in step with "Valid for" (quotations) and "Payment due in" (invoices).
// Only the sentence that says "valid for/within N days" or "due within/in N days" changes; other terms are left alone.
function syncTermDays(text, type, days){
  if (String(days ?? '').trim() === '') return text;
  const n = Math.max(0, Math.round(num(days))), unit = n === 1 ? 'day' : 'days';
  const re = type === 'quotation' ? /(valid\s+(?:for|within)\s+)\d+(\s+)days?\b/i : type === 'invoice' ? /(due\s+(?:within|in)\s+)\d+(\s+)days?\b/i : null;
  return re ? String(text || '').replace(re, (m, a, sp) => a + n + sp + unit) : text;
}
const blankItem = () => ({desc:'', unit:'', qty:'', rate:'', amount:'', from:'', via:'', to:'', ret:false, when:''});
function newDraft(type, kind){
  const s = S.settings, t = todayISO();
  kind = type === 'delivery' ? null : (kind === 'hire' ? 'hire' : 'goods');
  return { id:uid(), type, number:nextNumber(type,t), _auto:true, date:t, customerId:'', customer:{name:'',address:'',phone:''},
    po:'', project: kind === 'hire' ? hireProject() : '', deliveryAddress:'', kind, layout: kind === 'hire' ? 'lump' : 'items', items:[blankItem()], taxRate:0,
    terms: type==='quotation' ? syncTermDays(s.quoteTerms, 'quotation', num(s.quoteValidDays)||20) : type==='invoice' ? syncTermDays(s.invoiceTerms, 'invoice', num(s.invoiceDueDays)||5) : '',
    message: type==='delivery' ? s.deliveryMessage : '',
    status: type==='quotation' ? 'draft' : type==='delivery' ? 'pending' : 'issued',
    payments:[], validDays:num(s.quoteValidDays)||20, dueDays:num(s.invoiceDueDays)||5, sourceId:null, createdAt:new Date().toISOString(),
    ...(type === 'delivery' ? {signs:{byName:s.signName || '', byDate:'', toName:'', toDate:''}} : {}) };
}
function convertDraft(src, type){
  const d = newDraft(type);
  Object.assign(d, {customerId:src.customerId, customer:clone(src.customer||{}), po:src.po||'', project:src.project||'', sourceId:src.id,
    deliveryAddress: src.deliveryAddress || '', kind: type === 'delivery' ? null : kindOf(src), layout: src.layout || 'items', taxRate: src.taxRate || 0, discount: type === 'delivery' ? 0 : (src.discount || 0), discountType: src.discountType || 'pct'});
  d.items = clone(src.items||[]).map(it => {
    if (type === 'delivery' && src.layout === 'lump') return {...blankItem(), desc: kindOf(src) === 'hire' ? hireLines(it) : it.desc, unit: kindOf(src) === 'hire' ? 'Trip' : (it.unit || 'Lot'), qty: it.qty || 1};
    if (src.type === 'delivery' && d.layout === 'lump') return {...blankItem(), desc: it.desc};
    return it;
  });
  if (!d.items.length) d.items = [blankItem()];
  return d;
}

    if (d.type==='invoice') $('#h-due').textContent = 'Due ' + fmtDate(addDays(d.date, d.dueDays));
  };
  // Customer: a saved customer shows as a summary card (like on the invoice) with Edit; the boxes only show for a new customer or Edit
  let cEdit = false, cNew = false;   // cEdit: Edit details pressed; cNew: "New customer…" chosen in the list
  const showCust = () => {
    const sel = $('#f-cust').value, c = d.customer || {}, has = !!(c.name || '').trim();
    const fields = cEdit || cNew, card = !fields && has;
    $('#c-fields').hidden = !fields; $('#c-card').hidden = !card; $('#c-donewrap').hidden = !cEdit || cNew;
    if (card) $('#c-card').innerHTML = `<div class="cc-top"><span class="cc-lab">Customer</span><button type="button" class="btn sm" id="c-edit">✎ Edit details</button></div>
      <b class="${hasThaana(c.name) ? 'dv' : ''}">${esc(c.name)}</b>${String(c.address || '').trim() ? `<div class="${hasThaana(c.address) ? 'dv' : ''}">${nl(c.address)}</div>` : ''}${c.phone ? `<div>${esc(c.phone)}</div>` : ''}`;
  };
  const custNote = () => {
    showCust();

      $('#ibody').innerHTML = d.items.map((it,i) => `<tr class="trip">

    $('#ihead').innerHTML = `<tr><th>Description</th><th style="width:${isDN ? 16 : 12}%">Unit</th><th style="width:${isDN ? 16 : 11}%" class="n">Qty</th>${isDN ? '' : '<th style="width:14%" class="n">Rate</th><th style="width:14%" class="n">Amount</th>'}<th style="width:36px"></th></tr>`;

    const tx = num(d.taxRate);
    $('#tot').innerHTML = `<div class="totals"><span>Sub total</span><span>${money(subtotal(d))}</span>${discAmt(d) ? `<span>${esc(discLabel(d))}</span><span>-${money(discAmt(d))}</span>` : ''}${tx ? `<span>GST ${tx}%</span><span>${money(taxAmt(d))}</span>` : ''}<span>Grand total (MVR)</span><span class="gt">${money(total(d))}</span></div><div class="words">${esc(amountWords(total(d)))}</div>`;

  const form = $('#ed');

    const el = e.target;
    if (el.dataset.f){
      d[el.dataset.f] = el.value;
      if ((el.dataset.f === 'validDays' && d.type === 'quotation') || (el.dataset.f === 'dueDays' && d.type === 'invoice')){
        d.terms = syncTermDays(d.terms, d.type, el.value); const ta = $('#f-terms'); if (ta){ ta.value = d.terms; fitT(); }

    } else if (el.dataset.c){
      d.customer[el.dataset.c] = el.value;
      if (el.dataset.c === 'name' && !$('#f-cust').value && el.value){ $('#f-cust').value = '__new'; }
      custNote();
    } else if (el.dataset.k){
      const it = d.items[+el.dataset.i]; it[el.dataset.k] = el.value;
      if (el.dataset.k === 'desc'){
        const m = mem[el.value.trim().toLowerCase()];
        if (m){ const row = el.closest('tr');
          if (!it.unit && m.unit){ it.unit = m.unit; const u = row.querySelector('[data-k=unit]'); if (u) u.value = m.unit; }

        }
      }
      drawTotals();
    }
  });
  $('#c-card').addEventListener('click', e => { if (!e.target.closest('#c-edit')) return; cEdit = true; showCust(); $('#f-cname').focus(); });
  $('#c-done').addEventListener('click', () => { cEdit = false; custNote(); });
  $('#f-cust').addEventListener('change', e => { cEdit = false; cNew = e.target.value === '__new';
    const v = e.target.value;
    if (v && v !== '__new'){ const c = S.customers[v]; d.customerId = v; d.customer = {name:c.name||'', address:c.address||'', phone:c.phone||''}; }
    else { d.customerId = ''; if (v === '__new') d.customer = {name:'',address:'',phone:''}; }
    $('#f-cname').value = d.customer.name; $('#f-caddr').value = d.customer.address; $('#f-cphone').value = d.customer.phone || '';
    if (isDN && v && v !== '__new' && !d.deliveryAddress){ /* leave delivery address for the user */ }
    custNote(); if (v === '__new') $('#f-cname').focus();
  });
  islandPicker($('#ibody'));
  // Terms / delivery wording: locked until Edit (the number of days above still updates the wording automatically)
  const tbox = $('#f-terms') || $('#f-msg');
  const fitT = () => { tbox.style.height = 'auto'; tbox.style.height = (tbox.scrollHeight + 2) + 'px'; };
  fitT(); tbox.addEventListener('input', fitT);
  $('#t-edit').addEventListener('click', e => {
    const on = tbox.readOnly; tbox.readOnly = !on; tbox.classList.toggle('lockta', !on);
    e.currentTarget.textContent = on ? '🔒 Lock' : '✎ Edit'; e.currentTarget.setAttribute('aria-pressed', on);
    tbox.parentNode.querySelector('.t-lockhint').hidden = on;
    if (on){ tbox.focus(); tbox.setSelectionRange(tbox.value.length, tbox.value.length); } fitT();
  });
  // Description box: pick a saved product to fill the line (not for boat trips, where the description is the cargo)
  const fillLine = (it, p) => ({...it, desc: p.name || '', unit: p.unit || it.unit || '', qty: num(it.qty) ? it.qty : '1', rate: isDN ? (it.rate || '') : String(p.rate ?? '')});
  const focusQty = i => { const qty = $('#ibody').querySelector(`[data-i="${i}"][data-k="qty"]`); if (qty){ qty.focus(); qty.select(); } };
  productDrop($('#ibody'), {rates: !isDN, on: () => isDN || d.kind !== 'hire',
    pick: (i, p) => { const it = d.items[i]; if (!it || !p) return; d.items[i] = fillLine(it, p); drawItems(); focusQty(i); },
    // several ticked: the first fills this line, the rest become new lines right under it
    pickMany: (i, list) => { const it = d.items[i]; if (!it) return;
      d.items.splice(i, 1, fillLine(it, list[0]), ...list.slice(1).map(p => fillLine(blankItem(), p)));
      drawItems(); focusQty(i); toast(`${list.length} products added`); }});
  // trip date: a calendar fills the box as dd/mm/yyyy (typing a period like "13–15 Sep" still works)
  const openCal = i => { const pk = $('#ibody').querySelector(`[data-calp="${i}"]`); if (!pk) return;
    const m = String(d.items[i].when || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    pk.value = m ? `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : todayISO();
    try { pk.showPicker(); } catch(err){ pk.focus(); pk.click(); } };
  $('#ibody').addEventListener('change', e => {
    const pk = e.target.closest('[data-calp]'); if (!pk || !pk.value) return;
    const [y, mo, da] = pk.value.split('-'), box = $('#ibody').querySelector(`[data-i="${pk.dataset.calp}"][data-k="when"]`);
    box.value = `${da}/${mo}/${y}`; box.dispatchEvent(new Event('input', {bubbles:true}));
  });
  $('#ibody').addEventListener('click', e => {
    const cb = e.target.closest('[data-cal]'); if (cb) return openCal(+cb.dataset.cal);
    const wb = e.target.closest('input[data-k="when"]'); if (wb && !wb.value.trim()) return openCal(+wb.dataset.i);
    const rt = e.target.closest('[data-ret]');
    if (rt){ const it = d.items[+rt.dataset.ret]; it.ret = !it.ret; rt.classList.toggle('on', it.ret); rt.setAttribute('aria-pressed', it.ret); return; }
    const b = e.target.closest('[data-rm]'); if (!b) return; d.items.splice(+b.dataset.rm, 1); if (!d.items.length) d.items.push(blankItem()); drawItems(); });
  $('#add').addEventListener('click', () => { d.items.push(blankItem()); drawItems(); const t = $('#ibody').querySelectorAll('textarea'); t[t.length-1].focus(); });
  const kp = $('#kind');
  const markKind = () => kp && kp.querySelectorAll('[data-kind]').forEach(x => { const on = x.dataset.kind === d.kind; x.classList.toggle('on', on); x.setAttribute('aria-checked', on); });
  if (!isDN && !d.kind) d.kind = kindOf(d);
  if (kp) kp.addEventListener('click', e => {
    const b = e.target.closest('[data-kind]'); if (!b || b.dataset.kind === d.kind) return;
    if (b.dataset.kind === 'hire'){
      d.items = d.items.map(it => ({...blankItem(), desc: it.desc || '', amount: num(it.amount) ? it.amount : (r2(num(it.qty)*num(it.rate)) ? String(r2(num(it.qty)*num(it.rate))) : '')}));
      d.layout = 'lump'; if (!(d.project||'').trim()) d.project = hireProject();
    } else {
      d.items = d.items.map(it => ({...blankItem(), desc: it.desc || '', unit: num(it.amount) ? 'Trip' : '', qty: num(it.amount) ? '1' : '', rate: num(it.amount) ? it.amount : ''}));
      d.layout = 'items'; if (d.project === hireProject()) d.project = '';
    }
    d.kind = b.dataset.kind; const pj = $('#f-project'); if (pj) pj.value = d.project;
    markKind(); drawItems();
  });
  markKind();

  $('#save').addEventListener('click', async () => {
    if (!isEdit) d.number = nextNumber(d.type, d.date);   // always the next free number at the moment of saving
    d.number = (d.number||'').trim(); d.customer.name = (d.customer.name||'').trim();
    if (!d.number) return toast('Add a document number.'), $('#f-number').focus();
    if (!d.date) return toast('Pick a date.'), $('#f-date').focus();
    if (!d.customer.name){ cNew = true; if ($('#f-cust').value !== '__new') $('#f-cust').value = '__new'; custNote(); return toast('Choose a customer or add the customer\'s name.'), $('#f-cname').focus(); }
    d.items = d.items.filter(it => (it.desc||'').trim() || (it.from||'').trim() || (it.via||'').trim() || (it.to||'').trim() || num(it.qty) || num(it.rate) || num(it.amount));
    if (!d.items.length){ d.items = [blankItem()]; drawItems(); return toast('Add at least one line.'); }
    const dup = Object.values(S.docs).find(x => x.type === d.type && x.id !== d.id && (x.number||'').trim().toLowerCase() === d.number.toLowerCase());
    if (dup) return toast(`${d.number} is already used by another ${TYPES[d.type].label.toLowerCase()}. Change the number.`), $('#f-number').focus();
    const btn = $('#save'); btn.disabled = true;
    try {
      if (!d.customerId){
        const cid = uid();
        await put('customers', cid, {name:d.customer.name, address:d.customer.address||'', phone:d.customer.phone||'', email:'', createdAt:new Date().toISOString()});
        d.customerId = cid;
      }
      const body = clone(d); delete body._auto;
      body.validDays = num(body.validDays); body.dueDays = num(body.dueDays); body.taxRate = num(body.taxRate); body.discount = num(body.discount) > 0 ? num(body.discount) : 0; body.discountType = body.discountType === 'amt' ? 'amt' : 'pct';
      body.updatedAt = new Date().toISOString();
      await put('docs', d.id, body);
      if (!isEdit && src && src.type === 'quotation' && d.type === 'invoice' && src.status !== 'accepted'){
        await put('docs', src.id, {...src, status:'accepted', updatedAt:new Date().toISOString()});
      }
      toast(isEdit ? 'Changes saved' : `${TYPES[d.type].label} ${d.number} saved`);
      location.hash = '#/doc/' + d.id;
    } catch(e){ btn.disabled = false; }
  });

  drawItems(); hints(); custNote();
}
